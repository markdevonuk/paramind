<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Clue Hunt | Paramind</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="robots" content="noindex">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Paramind styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/menu-v2.css">

<style>
/* ═══════════════════════════════════════════════════════════
   CLUE HUNT (PRO) — every game class is prefixed ch- so it
   cannot clash with styles.css or Bootstrap.
   ═══════════════════════════════════════════════════════════ */
.ch-page{min-height:100vh;background:var(--color-gray-50)}
#clueHunt{
  --ch-teal:#2B8A9C; --ch-teal-dark:#237282; --ch-teal-bright:#3DA4B8; --ch-teal-soft:#e6f4f6;
  --ch-green:#4A9A4A; --ch-green-soft:#eaf6ea; --ch-surface:#FFFFFF; --ch-surface-2:#F1F3F5;
  --ch-ink:#212529; --ch-muted:#6C757D; --ch-line:#E9ECEF; --ch-amber:#9a6412; --ch-amber-soft:#fff4dc;
  --ch-red:#c82333; --ch-red-soft:#fdecee; --ch-shadow:0 10px 30px rgba(33,37,41,.10);
  --ch-mono:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,monospace;
  max-width:1120px;margin:0 auto;padding:16px 16px 40px;color:var(--ch-ink);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.5
}
#clueHunt [hidden]{display:none!important}
#clueHunt button{font:inherit;color:inherit;cursor:pointer}
#clueHunt h1,#clueHunt h2,#clueHunt h3,#clueHunt p{color:inherit}
#clueHunt button:focus-visible,#clueHunt [tabindex]:focus-visible{outline:3px solid var(--ch-teal-bright);outline-offset:2px}

/* buttons */
.ch-btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--ch-surface-2);color:var(--ch-ink)}
#clueHunt .ch-btn.ch-primary{background:var(--ch-teal);color:#fff}
#clueHunt .ch-btn.ch-primary:hover{background:var(--ch-teal-dark);color:#fff}
.ch-btn.ch-ghost{background:transparent;border:1.5px solid var(--ch-line)}
.ch-big{padding:14px 24px;font-size:1.02rem}
.ch-wide{width:100%;margin-top:10px}
.ch-eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ch-teal)}
.ch-policy{font-size:.85rem;color:var(--ch-muted);text-align:center;margin:18px 0 0}

/* home */
.ch-head{text-align:center;padding:10px 0 16px}
.ch-head h1{font-weight:800;font-size:clamp(2.1rem,6vw,3rem);letter-spacing:-.03em;margin:4px 0 6px}
.ch-head p{color:var(--ch-muted);max-width:36rem;margin:0 auto}
.ch-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:620px;margin:0 auto}
.ch-tab{border:1.5px solid var(--ch-line);background:var(--ch-surface);border-radius:12px;padding:10px 8px;font-weight:700;display:grid;gap:2px}
.ch-tab small{font-weight:500;color:var(--ch-muted);font-size:.78rem}
.ch-tab.on{border-color:var(--ch-teal);box-shadow:inset 0 0 0 1px var(--ch-teal);color:var(--ch-teal-dark)}
.ch-lvl{text-align:center;color:var(--ch-muted);font-size:.9rem;margin:12px 0}
.ch-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:820px;margin:0 auto}
.ch-card{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--ch-surface);border:1.5px solid var(--ch-line);border-radius:14px;padding:14px}
.ch-card:hover{border-color:var(--ch-teal)}
.ch-card-n{width:36px;height:36px;border-radius:10px;background:var(--ch-teal-soft);color:var(--ch-teal);display:grid;place-items:center;font-weight:800}
.ch-card-main{display:grid;min-width:0}
.ch-card-main span{color:var(--ch-muted);font-size:.88rem}
.ch-card-best{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ch-surface-2);color:var(--ch-muted)}
.ch-card-best.done{background:var(--ch-green-soft);color:var(--ch-green)}
.ch-soon{text-align:center;color:var(--ch-muted);grid-column:1/-1;padding:24px 0}

/* brief */
.ch-brief{max-width:560px;margin:0 auto;display:grid;gap:16px}
.ch-back{justify-self:start;border:0;background:none;color:var(--ch-teal);font-weight:700;padding:4px 0}
.ch-dispatch{background:#0f2a33;color:#d8f1f6;border-radius:16px;padding:18px;box-shadow:var(--ch-shadow);font-family:var(--ch-mono);font-size:.88rem}
.ch-dispatch .ch-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#7fc9d8;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px dashed #2b5260;padding-bottom:10px;margin-bottom:12px}
.ch-cat{background:#e8a948;color:#2a1b04;padding:1px 8px;border-radius:6px;font-weight:700}
.ch-dispatch p{margin:0 0 8px;line-height:1.55;color:#d8f1f6}
.ch-dispatch .ch-addr{color:#9cc5cf}

/* hud */
.ch-hud{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;margin-bottom:12px}
.ch-who{display:grid}.ch-who span{color:var(--ch-muted);font-size:.88rem}
.ch-hud-r{display:flex;align-items:center;gap:14px}
.ch-abcde,.ch-path{display:flex;gap:4px;flex-wrap:wrap}
.ch-chip{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--ch-surface-2);color:var(--ch-muted);border:1px solid var(--ch-line);position:relative}
.ch-chip.on{background:var(--ch-teal);color:#fff;border-color:var(--ch-teal)}
.ch-chip sup{position:absolute;top:-7px;right:-6px;font-size:.62rem;background:var(--ch-ink);color:#fff;border-radius:999px;min-width:15px;height:15px;display:grid;place-items:center;font-weight:700}
.ch-clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.ch-clock span{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ch-muted);font-weight:600}
.ch-clock b{font-family:var(--ch-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}

/* game */
.ch-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;align-items:start}
.ch-stage{display:grid;gap:12px}
.ch-scene-wrap{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--ch-shadow);background:#22313d;max-width:560px;width:100%;justify-self:center}
.ch-scene{display:block;width:100%;height:auto}
.ch-doorway{position:absolute;inset:0;display:grid;place-items:end center;padding:18px;background:linear-gradient(to top,rgba(8,20,26,.82),rgba(8,20,26,0) 55%);color:#fff;text-align:center;pointer-events:none}
.ch-count{font-family:var(--ch-mono);font-size:2.4rem;font-weight:700;line-height:1}
.ch-tools{display:flex;flex-wrap:wrap;gap:8px;max-width:560px;width:100%;justify-self:center}
.ch-tools .ch-btn{flex:1 1 auto}
.ch-toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ch-muted);padding:0 6px;flex:1 1 100%;margin:0}
.ch-toggle input{accent-color:var(--ch-teal);width:18px;height:18px}

.ch-hs{cursor:pointer;outline:none}
.ch-hs-shape{fill:rgba(53,176,200,0);stroke:transparent;stroke-width:2.5;transition:fill .2s,stroke .2s}
.ch-glow .ch-hs-shape{stroke:#7fe0f0;stroke-dasharray:5 6;fill:rgba(53,176,200,.08);animation:chHsPulse 2.4s ease-in-out infinite}
.ch-hs:hover .ch-hs-shape,.ch-hs:focus-visible .ch-hs-shape{fill:rgba(53,176,200,.2);stroke:#bff3fb;stroke-dasharray:none}
.ch-hs.done .ch-hs-shape{stroke:#8ee59a;stroke-dasharray:3 5;animation:none;fill:rgba(111,208,122,.08)}
.ch-hs.active .ch-hs-shape{stroke:#ffffff;stroke-dasharray:none;fill:rgba(255,255,255,.14);animation:none}
.ch-locked .ch-hs{pointer-events:none}.ch-locked .ch-hs-shape{opacity:0}
@keyframes chHsPulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}

#chUpper{transform-box:view-box;transform-origin:200px 300px;animation:chBreathe 2s ease-in-out infinite}
@keyframes chBreathe{0%,100%{transform:translateY(0) scale(1,1)}42%{transform:translateY(-3.5px) scale(1.022,1.018)}}
.ch-gasp{transform-box:fill-box;transform-origin:center;animation:chGasp 2s ease-in-out infinite}
@keyframes chGasp{0%,100%{transform:scaleY(.65)}42%{transform:scaleY(1.2)}}
.ch-sweat{animation:chShine 3s ease-in-out infinite}
@keyframes chShine{0%,100%{opacity:.55}50%{opacity:1}}
.ch-shiver{animation:chShiver .16s linear infinite}
@keyframes chShiver{0%,100%{transform:translateX(0)}25%{transform:translateX(.9px)}75%{transform:translateX(-.9px)}}
.ch-floor-breathe{transform-box:fill-box;transform-origin:center;animation:chBreatheF 3s ease-in-out infinite}
@keyframes chBreatheF{0%,100%{transform:scale(1,1)}42%{transform:scale(1.04,1)}}
#chUpper.ch-deep{animation-name:chBreatheDeep}
@keyframes chBreatheDeep{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-6px) scale(1.04,1.035)}}
.ch-restless{transform-box:view-box;transform-origin:200px 420px;animation:chRestless 2.6s ease-in-out infinite}
@keyframes chRestless{0%,100%{transform:rotate(0)}25%{transform:rotate(2.2deg)}50%{transform:rotate(-1deg)}75%{transform:rotate(-2.4deg)}}
.ch-mini-breathe{transform-box:view-box;transform-origin:60px 112px;animation:chBreathe 2s ease-in-out infinite}
#chVeins,#chScm2{transition:opacity .8s}
#chBubble{transition:opacity .3s}
.ch-flash{animation:chFlash 1.2s ease-out 1}
@keyframes chFlash{0%{filter:drop-shadow(0 0 0 #fff)}30%{filter:drop-shadow(0 0 6px #bff3fb)}100%{filter:drop-shadow(0 0 0 #fff)}}

.ch-side{display:grid;gap:16px;align-content:start;min-width:0}
.ch-panel{background:var(--ch-surface);border:1px solid var(--ch-line);border-radius:18px;padding:16px;min-width:0}
.ch-panel h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ch-muted);margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.ch-notes{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ch-notes li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.92rem;padding:8px 10px;border-radius:10px;background:var(--ch-surface-2);animation:chNoteIn .35s ease-out}
@keyframes chNoteIn{from{transform:translateY(-4px);opacity:0}to{transform:none;opacity:1}}
.ch-tag{font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--ch-surface);color:var(--ch-teal);border:1px solid var(--ch-line);white-space:nowrap;margin-top:2px}
.ch-empty{color:var(--ch-muted);font-size:.92rem;margin:0}

.ch-sheet-back{display:none}
.ch-sheet{background:var(--ch-surface);border:1px solid var(--ch-line);border-radius:18px;padding:16px;box-shadow:var(--ch-shadow);min-width:0}
.ch-sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ch-sheet-head h3{margin:0;font-size:1.1rem;font-weight:700}
.ch-x{border:0;background:var(--ch-surface-2);width:34px;height:34px;border-radius:10px;font-size:1.1rem;line-height:1}
.ch-acts{display:grid;gap:8px}
.ch-act{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--ch-line);background:var(--ch-surface);border-radius:12px;padding:10px 12px}
.ch-act:hover{border-color:var(--ch-teal)}
.ch-act small{color:var(--ch-muted)}
.ch-L{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--ch-teal-soft);color:var(--ch-teal);font-weight:800;font-size:.85rem}
.ch-cost{font-family:var(--ch-mono);font-size:.75rem;color:var(--ch-muted)}
.ch-act.done{background:var(--ch-surface-2);border-color:transparent}
.ch-act.done .ch-cost{color:var(--ch-green);font-family:inherit;font-weight:700}
.ch-res{grid-column:2 / 4;font-size:.9rem;font-weight:600}
.ch-who-s{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ch-teal)}
.ch-hint{font-size:.85rem;color:var(--ch-muted);margin:4px 0 10px}
.ch-amber{color:var(--ch-amber)!important}
.ch-counter{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.ch-counter svg{width:120px;height:120px;border-radius:14px;background:#22313d}
.ch-tapbtn{width:100%;padding:18px;border-radius:14px;border:0;background:var(--ch-teal);color:#fff!important;font-weight:800;font-size:1.15rem}
.ch-tapbtn:disabled{opacity:.5}
.ch-bar{height:8px;border-radius:999px;background:var(--ch-surface-2);overflow:hidden;margin-top:10px}
.ch-bar i{display:block;height:100%;width:0;background:var(--ch-teal-bright)}
.ch-big-n{font-family:var(--ch-mono);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.ch-result{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--ch-green-soft);font-weight:600}
.ch-result.warn{background:var(--ch-amber-soft)}
.ch-monitor{background:#071116;border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-family:var(--ch-mono)}
.ch-monitor div{display:grid}
.ch-monitor small{font-size:.66rem;letter-spacing:.06em;color:#7aa3ad}
.ch-monitor b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.v-hr b{color:#6fe08a}.v-sp b{color:#6fd3f0}.v-rr b{color:#f1e170}.v-bp b{color:#f08aa0}.v-t b{color:#e9eef0}.v-bm b{color:#c7a7ff}
.ch-opts{display:grid;gap:8px;margin:6px 0 12px}
.ch-opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--ch-line);border-radius:12px;padding:12px;background:var(--ch-surface);text-align:left}
.ch-opt.sel{border-color:var(--ch-teal);box-shadow:inset 0 0 0 1px var(--ch-teal)}

/* debrief */
.ch-debrief{display:grid;gap:18px;max-width:860px;margin:0 auto}
.ch-verdict{border-radius:20px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--ch-surface);border:1px solid var(--ch-line)}
.ch-verdict h2{margin:4px 0 6px;font-size:clamp(1.4rem,4vw,2rem);line-height:1.15;letter-spacing:-.02em;font-weight:800}
.ch-verdict p{margin:0;color:var(--ch-muted)!important}
.ch-score{text-align:center}
.ch-score .n{font-family:var(--ch-mono);font-size:2.6rem;font-weight:700;line-height:1}
.ch-score small{color:var(--ch-muted);display:block}
#clueHunt .ok{color:var(--ch-green)} #clueHunt .bad{color:var(--ch-red)}
.ch-feedback{background:var(--ch-amber-soft);border-radius:14px;padding:12px 14px}
.ch-sep{border-left:4px solid var(--ch-teal-bright);background:var(--ch-teal-soft);border-radius:0 14px 14px 0;padding:14px 16px}
.ch-sep h3{margin:0 0 6px;font-size:1rem;font-weight:700}.ch-sep p{margin:0}
.ch-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.ch-rows{display:grid;gap:6px}
.ch-rows div{display:flex;justify-content:space-between;gap:10px;font-size:.93rem;padding:6px 0;border-bottom:1px dashed var(--ch-line)}
.ch-rows div:last-child{border:0}
.ch-rows small{color:var(--ch-muted)}
.ch-rows b{font-family:var(--ch-mono)}
.ch-clist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ch-clist li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:.92rem}
.ch-mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;margin-top:1px}
.ch-clist .f .ch-mk{background:var(--ch-green-soft);color:var(--ch-green)}
.ch-clist .m .ch-mk{background:var(--ch-red-soft);color:var(--ch-red)}
.ch-clist .m{color:var(--ch-muted)}
.ch-hollie{display:grid;grid-template-columns:52px 1fr;gap:14px}
.ch-av{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--ch-teal-soft)}
.ch-hollie p{margin:0 0 10px;max-width:65ch}
.ch-end{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@media (max-width:820px){
  .ch-grid,.ch-cols{grid-template-columns:1fr}
  .ch-cards{grid-template-columns:1fr}
  .ch-sheet-back{display:block;position:fixed;inset:0;background:rgba(5,15,20,.45);z-index:1040}
  .ch-sheet{position:fixed;left:0;right:0;bottom:0;z-index:1041;border-radius:20px 20px 0 0;max-height:72vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:460px){
  .ch-verdict{grid-template-columns:1fr}
  .ch-counter{grid-template-columns:96px 1fr}.ch-counter svg{width:96px;height:96px}
  .ch-monitor{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){ .ch-glow .ch-hs-shape,.ch-sweat,.ch-notes li,.ch-shiver,.ch-restless{animation:none} }
</style>
</head>
