<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>What's New | Paramind</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/menu-v2.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* ================================================================
           PARAMIND — WHAT'S NEW (public article list + single article view)
           ================================================================ */
        .landing-page { min-height: 100vh; background: #FFFFFF; overflow-x: hidden; position: relative; }
        .landing-container { max-width: 920px; margin: 0 auto; padding: 0.5rem 1rem 3rem; position: relative; z-index: 1; }

        /* Section header (slim coloured strip mirroring learn/practise/reflect) */
        .section-header {
            background: linear-gradient(135deg, #0F4252 0%, #2B8A9C 60%, #1F6B7C 100%);
            border-radius: 18px;
            padding: 1.5rem 1.75rem;
            margin-top: 0.75rem;
            margin-bottom: 1.5rem;
            color: #fff;
            box-shadow: 0 6px 18px rgba(15, 66, 82, 0.10);
        }
        .section-header-label {
            font-family: 'JetBrains Mono', 'DM Sans', monospace;
            font-size: 0.7rem; letter-spacing: 2.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.75);
            margin-bottom: 0.35rem;
        }
        .section-header-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2rem; font-weight: 700; line-height: 1;
            letter-spacing: -0.5px; margin: 0; color: #fff;
        }
        .section-header-tagline {
            font-size: 1rem; color: rgba(255,255,255,0.9);
            margin-top: 0.5rem; font-weight: 500;
        }

        /* Back link (single article view) */
        .article-back {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            text-decoration: none;
            color: var(--color-gray-600);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.5rem 0;
            margin: 0.25rem 0 0.75rem;
            transition: color 0.2s;
        }
        .article-back:hover { color: var(--color-teal); }

        /* List view: article cards */
        .article-list { display: flex; flex-direction: column; gap: 1rem; }
        .article-card {
            display: flex;
            gap: 1rem;
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 16px;
            padding: 1rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            box-shadow: 0 2px 8px rgba(15, 66, 82, 0.04);
        }
        .article-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(15, 66, 82, 0.10);
            border-color: rgba(43, 138, 156, 0.25);
            color: inherit;
        }
        .article-card-cover {
            flex: 0 0 120px;
            width: 120px;
            height: 100px;
            border-radius: 10px;
            background: #f1f3f5;
            background-size: cover;
            background-position: center;
        }
        .article-card-cover.empty {
            display: flex; align-items: center; justify-content: center;
            color: #adb5bd; font-size: 1.6rem;
        }
        .article-card-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0.25rem; }
        .article-card-title {
            font-size: 1.1rem; font-weight: 700;
            color: var(--color-gray-800);
            line-height: 1.3;
        }
        .article-card-date {
            font-size: 0.78rem;
            color: var(--color-gray-500);
            font-family: 'DM Sans', sans-serif;
        }
        .article-card-excerpt {
            font-size: 0.9rem;
            color: var(--color-gray-700);
            line-height: 1.5;
            margin-top: 0.25rem;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        @media (max-width: 540px) {
            .article-card { flex-direction: column; }
            .article-card-cover { width: 100%; height: 160px; }
        }

        /* Single article view */
        .article-detail { background: #fff; border-radius: 18px; padding: 1.5rem; border: 1px solid #e9ecef; }
        .article-cover-hero {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            background: #f1f3f5;
        }
        .article-detail h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.9rem; font-weight: 700;
            color: var(--color-gray-800);
            margin: 0 0 0.4rem;
            line-height: 1.2;
        }
        .article-detail .meta {
            font-size: 0.85rem;
            color: var(--color-gray-500);
            margin-bottom: 1.25rem;
            font-family: 'DM Sans', sans-serif;
        }

        /* Quill-output styling — keep it Paramind-shaped */
        .article-content { font-size: 1rem; line-height: 1.65; color: var(--color-gray-800); }
        .article-content h1, .article-content h2, .article-content h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            color: var(--color-gray-800);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .article-content h1 { font-size: 1.6rem; }
        .article-content h2 { font-size: 1.35rem; }
        .article-content h3 { font-size: 1.15rem; }
        .article-content p { margin: 0 0 1rem; }
        .article-content img { max-width: 100%; height: auto; border-radius: 10px; display: block; margin: 1rem 0; }
        .article-content a { color: var(--color-teal); text-decoration: underline; }
        .article-content a:hover { color: #1F6B7C; }
        .article-content ul, .article-content ol { padding-left: 1.5rem; margin: 0 0 1rem; }
        .article-content li { margin-bottom: 0.3rem; }
        .article-content blockquote {
            border-left: 3px solid var(--color-teal);
            padding: 0.25rem 0 0.25rem 1rem;
            margin: 1rem 0;
            color: var(--color-gray-700);
            font-style: italic;
            background: rgba(43, 138, 156, 0.04);
            border-radius: 0 8px 8px 0;
        }
        .article-content pre, .article-content code {
            font-family: 'JetBrains Mono', monospace;
            background: #f1f3f5;
            border-radius: 6px;
            padding: 0.15rem 0.4rem;
            font-size: 0.9em;
        }
        .article-content pre { padding: 0.75rem 1rem; overflow-x: auto; }
        .article-content pre code { background: transparent; padding: 0; }
        .article-content .ql-align-center { text-align: center; }
        .article-content .ql-align-right  { text-align: right;  }
        .article-content .ql-align-justify { text-align: justify; }

        /* Attachments block */
        .article-attachments {
            margin-top: 2rem;
            padding-top: 1.25rem;
            border-top: 1px solid #e9ecef;
        }
        .article-attachments h3 {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--color-gray-600);
            margin: 0 0 0.5rem;
        }
        .article-attachment-link {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.85rem;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            text-decoration: none;
            color: var(--color-gray-800);
            margin-bottom: 0.4rem;
            transition: background 0.2s, border-color 0.2s;
        }
        .article-attachment-link:hover {
            background: #fff;
            border-color: rgba(43, 138, 156, 0.4);
            color: var(--color-teal);
        }
        .article-attachment-link i { font-size: 1.15rem; color: var(--color-teal); }
        .article-attachment-meta { color: var(--color-gray-500); font-size: 0.8rem; margin-left: auto; }

        /* Empty / error states */
        .state-message {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--color-gray-500);
            font-size: 0.95rem;
        }
        .state-message i { font-size: 2rem; display: block; margin-bottom: 0.5rem; color: var(--color-gray-400); }
        .loading-spinner {
            display: flex; justify-content: center; align-items: center;
            padding: 3rem;
        }
        .loading-spinner .spinner-border { color: var(--color-teal); }
    </style>
</head>

<body class="landing-page member-page">

    <nav class="member-navbar">
        <div class="container">

                <a class="navbar-brand" href="landing.html">

    <div class="landing-container">

        <!-- Back link (only visible in single-article view) -->
        <a href="whatsnew.html" class="article-back" id="articleBackLink" style="display: none;">

        <!-- Section header (list view only) -->
        <div class="section-header" id="listHeader">

    <!-- Firebase compat SDK (matches the rest of the public pages) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- ==================== WHAT'S NEW LOGIC ==================== -->
    <script>
        (function () {
            'use strict';

            // ---- Firebase init (guarded — menu-v2.js initialises lazily) ----
            const firebaseConfig = {
                apiKey: "AIzaSyC01FaWpNvJQ_LyXYBUx3Z5L2BYRrCNOUE",
                authDomain: "paramind-64b8e.firebaseapp.com",
                projectId: "paramind-64b8e",
                storageBucket: "paramind-64b8e.firebasestorage.app",
                messagingSenderId: "452173393964",
                appId: "1:452173393964:web:8599c0fe1983a6f441e189",
                measurementId: "G-GW385S6L0L"
            };
            try {
                if (!firebase.apps || !firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
            } catch (e) { /* already initialised — fine */ }

            const auth = firebase.auth();
            const db   = firebase.firestore();

            const contentEl = document.getElementById('content');
            const listHeaderEl = document.getElementById('listHeader');
            const backLinkEl = document.getElementById('articleBackLink');

            // ---- Detect view mode ----
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get('id');

            // ---- Auth gate ----
            auth.onAuthStateChanged(function (user) {
                if (!user) {
                    // Redirect unauthenticated users to login, with return URL
                    const returnUrl = encodeURIComponent(window.location.href);
                    window.location.href = 'login.html?redirect=' + returnUrl;
                    return;
                }
                if (articleId) {
                    loadSingleArticle(articleId);
                } else {
                    loadArticleList();
                }
            });


            // ============================================================
            // LIST VIEW
            // ============================================================
            async function loadArticleList() {
                listHeaderEl.style.display = '';
                backLinkEl.style.display = 'none';

                try {
                    const snap = await db.collection('articles')
                        .orderBy('publishedAt', 'desc')
                        .get();

                    if (snap.empty) {
                        contentEl.innerHTML = `
                            <div class="state-message">
                                <i class="bi bi-newspaper"></i>
                                Nothing here yet. Check back soon.
                            </div>`;
                        return;
                    }

                    const cards = [];
                    snap.forEach(d => {
                        const a = d.data();
                        if (a.status && a.status !== 'published') return; // future-proofing for drafts
                        const date = formatDate(a.publishedAt);
                        const cover = a.coverImage
                            ? `<div class="article-card-cover" style="background-image: url('${escapeAttr(a.coverImage)}');"></div>`
                            : `<div class="article-card-cover empty"><i class="bi bi-newspaper"></i></div>`;
                        cards.push(`
                            <a class="article-card" href="whatsnew.html?id=${encodeURIComponent(d.id)}">
                                ${cover}
                                <div class="article-card-body">
                                    <div class="article-card-date">${date}</div>
                                    <div class="article-card-title">${escapeHtml(a.title || 'Untitled')}</div>
                                    <div class="article-card-excerpt">${escapeHtml(a.excerpt || '')}</div>
                                </div>
                            </a>
                        `);
                    });

                    if (cards.length === 0) {
                        contentEl.innerHTML = `
                            <div class="state-message">
                                <i class="bi bi-newspaper"></i>
                                Nothing here yet. Check back soon.
                            </div>`;
                        return;
                    }

                    contentEl.innerHTML = `<div class="article-list">${cards.join('')}</div>`;
                } catch (err) {
                    console.error('Could not load articles:', err);
                    showError(err);
                }
            }


            // ============================================================
            // SINGLE ARTICLE VIEW
            // ============================================================
            async function loadSingleArticle(id) {
                listHeaderEl.style.display = 'none';
                backLinkEl.style.display = '';

                try {
                    const docSnap = await db.collection('articles').doc(id).get();
                    if (!docSnap.exists) {
                        contentEl.innerHTML = `
                            <div class="state-message">
                                <i class="bi bi-question-circle"></i>
                                Article not found. It may have been removed.
                            </div>`;
                        document.title = 'Article not found | Paramind';
                        return;
                    }

                    const a = docSnap.data();
                    document.title = (a.title || 'Article') + ' | Paramind';

                    const cover = a.coverImage
                        ? `<img class="article-cover-hero" src="${escapeAttr(a.coverImage)}" alt="">`
                        : '';

                    const attachments = Array.isArray(a.attachments) && a.attachments.length
                        ? `
                            <div class="article-attachments">
                                <h3>Attachments</h3>
                                ${a.attachments.map(att => `
                                    <a class="article-attachment-link" href="${escapeAttr(att.url)}" target="_blank" rel="noopener">
                                        <i class="bi ${iconForAttachment(att)}"></i>
                                        <span>${escapeHtml(att.name || 'Attachment')}</span>
                                        <span class="article-attachment-meta">${formatSize(att.size)}</span>
                                    </a>
                                `).join('')}
                            </div>`
                        : '';

                    contentEl.innerHTML = `
                        <div class="article-detail">
                            ${cover}
                            <h1>${escapeHtml(a.title || 'Untitled')}</h1>
                            <div class="meta">${formatDate(a.publishedAt)}${a.author ? ' &middot; ' + escapeHtml(a.author) : ''}</div>
                            <div class="article-content">${cleanQuillHTML(a.content)}</div>
                            ${attachments}
                        </div>
                    `;
                } catch (err) {
                    console.error('Could not load article:', err);
                    showError(err);
                }
            }


            // ============================================================
            // HELPERS
            // ============================================================
            function formatDate(ts) {
                if (!ts || !ts.toDate) return '';
                return ts.toDate().toLocaleDateString('en-GB', {
                    day: 'numeric', month: 'long', year: 'numeric'
                });
            }
            function formatSize(bytes) {
                if (!bytes || isNaN(bytes)) return '';
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            }
            function iconForAttachment(att) {
                const t = (att.type || '').toLowerCase();
                const n = (att.name || '').toLowerCase();
                if (t.includes('pdf')  || n.endsWith('.pdf'))   return 'bi-file-earmark-pdf';
                if (t.includes('word') || n.match(/\.docx?$/))  return 'bi-file-earmark-word';
                if (t.includes('sheet') || n.match(/\.xlsx?$/)) return 'bi-file-earmark-excel';
                if (t.includes('image') || n.match(/\.(png|jpe?g|gif|webp|svg)$/)) return 'bi-file-earmark-image';
                return 'bi-file-earmark';
            }
            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, c => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[c]));
            }
            function escapeAttr(s) {
                return String(s).replace(/"/g, '&quot;');
            }
            // Strip Quill's empty paragraph artifacts (<p><br></p>, <p>&nbsp;</p>, etc.)
            // Each empty paragraph would otherwise render as a ~42px gap.
            function cleanQuillHTML(html) {
                if (!html) return '';
                return html.replace(/<p>(?:\s|&nbsp;|<br\s*\/?>)*<\/p>/g, '');
            }
            function showError(err) {
                let msg = (err && err.message) || String(err);
                if (err && err.code === 'permission-denied') {
                    msg = 'You do not have permission to view this. Please sign in again.';
                }
                contentEl.innerHTML = `
                    <div class="state-message">
                        <i class="bi bi-exclamation-circle"></i>
                        Could not load: ${escapeHtml(msg)}
                    </div>`;
            }
        })();
    </script>
