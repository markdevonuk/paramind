<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>CPD Activity | Paramind</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Menu CSS -->
    <link rel="stylesheet" href="css/menu-v2.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        /* ==================== PAGE LAYOUT ==================== */
        .main-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .page-header {
            background: var(--color-white);
            padding: 1.5rem;
            border-bottom: 1px solid var(--color-gray-200);
            text-align: center;
        }

        .page-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--color-gray-900);
            margin: 0 0 0.25rem 0;
        }

        .page-header p {
            color: var(--color-gray-600);
            margin: 0;
            font-size: 0.9rem;
        }

        .page-header .bi {
            color: var(--color-teal);
            margin-right: 0.4rem;
        }

        /* ==================== CONTENT AREA ==================== */
        .activity-content {
            padding: 1.25rem;
            max-width: 900px;
            margin: 0 auto;
        }

        /* ==================== FILTER BAR ==================== */
        .filter-section {
            background: var(--color-white);
            border: 1px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-sm);
        }

        .filter-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-gray-600);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.6rem;
        }

        .quick-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.9rem;
        }

        .quick-btn {
            padding: 0.35rem 0.85rem;
            border-radius: var(--radius-full);
            border: 1.5px solid var(--color-gray-300);
            background: var(--color-white);
            color: var(--color-gray-700);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: var(--font-primary);
        }

        .quick-btn:hover {
            border-color: var(--color-teal);
            color: var(--color-teal);
        }

        .quick-btn.active {
            background: var(--color-teal);
            border-color: var(--color-teal);
            color: white;
        }

        .custom-range {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .custom-range label {
            font-size: 0.82rem;
            color: var(--color-gray-600);
            font-weight: 500;
            white-space: nowrap;
        }

        .date-input {
            padding: 0.35rem 0.6rem;
            border: 1.5px solid var(--color-gray-300);
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            color: var(--color-gray-800);
            font-family: var(--font-primary);
            background: var(--color-white);
            cursor: pointer;
        }

        .date-input:focus {
            outline: none;
            border-color: var(--color-teal);
        }

        .apply-btn {
            padding: 0.35rem 0.85rem;
            background: var(--color-teal);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-primary);
            transition: background 0.15s ease;
        }

        .apply-btn:hover {
            background: var(--color-teal-dark);
        }

        /* ==================== STATS CARDS ==================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        @media (min-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .stat-card {
            background: var(--color-white);
            border: 1px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            padding: 1rem;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .stat-card .stat-icon {
            font-size: 1.5rem;
            color: var(--color-teal);
            margin-bottom: 0.4rem;
        }

        .stat-card .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-gray-900);
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            color: var(--color-gray-600);
            font-weight: 500;
        }

        /* ==================== CHARTS ==================== */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        @media (min-width: 700px) {
            .charts-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .chart-card {
            background: var(--color-white);
            border: 1px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            padding: 1.1rem;
            box-shadow: var(--shadow-sm);
        }

        .chart-card h3 {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--color-gray-800);
            margin: 0 0 1rem 0;
        }

        .chart-wrapper {
            position: relative;
            height: 220px; /* overridden by JS for tool chart */
        }

        /* ==================== SESSIONS TABLE ==================== */
        .table-card {
            background: var(--color-white);
            border: 1px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-sm);
        }

        .table-card-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--color-gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-card-header h3 {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--color-gray-800);
            margin: 0;
        }

        .session-count-badge {
            background: var(--color-gray-100);
            color: var(--color-gray-600);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.55rem;
            border-radius: var(--radius-full);
        }

        .sessions-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.83rem;
        }

        .sessions-table th {
            padding: 0.6rem 1rem;
            text-align: left;
            background: var(--color-gray-50);
            color: var(--color-gray-600);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid var(--color-gray-200);
        }

        .sessions-table td {
            padding: 0.7rem 1rem;
            border-bottom: 1px solid var(--color-gray-100);
            color: var(--color-gray-800);
            vertical-align: middle;
        }

        .sessions-table tr:last-child td {
            border-bottom: none;
        }

        .sessions-table tr:hover td {
            background: var(--color-gray-50);
        }

        .tool-pill {
            display: inline-block;
            padding: 0.15rem 0.55rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            background: #d4eef2;
            color: var(--color-teal-dark);
        }

        .duration-text {
            font-weight: 600;
            color: var(--color-gray-700);
            font-variant-numeric: tabular-nums;
        }

        /* ==================== EMPTY STATE ==================== */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--color-gray-500);
        }

        .empty-state .bi {
            font-size: 2.5rem;
            color: var(--color-gray-300);
            display: block;
            margin-bottom: 0.75rem;
        }

        .empty-state p {
            margin: 0;
            font-size: 0.9rem;
        }

        /* ==================== EXPORT BUTTON ==================== */
        .export-section {
            text-align: center;
            padding-bottom: 2rem;
        }

        .export-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.75rem;
            background: var(--color-teal);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-primary);
            transition: background 0.15s ease;
            box-shadow: var(--shadow-md);
        }

        .export-btn:hover {
            background: var(--color-teal-dark);
        }

        .export-btn:disabled {
            background: var(--color-gray-400);
            cursor: not-allowed;
        }

        /* ==================== PERIOD LABEL ==================== */
        .period-label {
            text-align: center;
            font-size: 0.8rem;
            color: var(--color-gray-500);
            margin-bottom: 1rem;
            font-weight: 500;
        }

        /* ==================== LOADING STATE ==================== */
        .loading-spinner {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--color-gray-500);
        }

        .spinner-ring {
            width: 36px;
            height: 36px;
            border: 3px solid var(--color-gray-200);
            border-top-color: var(--color-teal);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.75rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<script>
/* ==================== CPD ACTIVITY PAGE LOGIC ==================== */

// ==================== STATE ====================
var allSessions   = [];   // All loaded sessions (complete=true)
var filteredSessions = [];
var toolChartInst = null;
var timelineChartInst = null;
var activeFilter  = 'month';
var customStartDate = null;
var customEndDate   = null;

// ==================== WAIT FOR FIREBASE ====================
function waitForFirebase(cb) {
    var t = Date.now();
    function check() {
        if (typeof firebase !== 'undefined' && firebase.auth && firebase.firestore &&
            firebase.apps && firebase.apps.length > 0) { cb(true); return; }
        if (Date.now() - t > 12000) { cb(false); return; }
        setTimeout(check, 200);
    }
    check();
}

// ==================== DATE HELPERS ====================
function startOfDay(d) {
    var r = new Date(d); r.setHours(0,0,0,0); return r;
}

function endOfDay(d) {
    var r = new Date(d); r.setHours(23,59,59,999); return r;
}

function getDateRange(period) {
    var now   = new Date();
    var start, end;
    end = endOfDay(now);

    if (period === 'month') {
        start = new Date(now.getFullYear(), now.getMonth(), 1);
    } else if (period === 'lastmonth') {
        start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        end   = endOfDay(new Date(now.getFullYear(), now.getMonth(), 0));
    } else if (period === '3months') {
        start = new Date(now.getFullYear(), now.getMonth() - 3, now.getDate());
    } else if (period === 'all') {
        start = new Date(2025, 0, 1); // Beginning of Paramind
    } else if (period === 'custom') {
        start = customStartDate ? startOfDay(customStartDate) : new Date(2025, 0, 1);
        end   = customEndDate   ? endOfDay(customEndDate)     : endOfDay(now);
    }
    return { start: start, end: end };
}

function formatDate(dateObj) {
    return dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatShortDate(dateObj) {
    return dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function formatDuration(seconds) {
    if (seconds < 60)  { return seconds + 's'; }
    if (seconds < 3600) {
        var m = Math.floor(seconds / 60);
        var s = seconds % 60;
        return s > 0 ? m + 'm ' + s + 's' : m + 'm';
    }
    var h  = Math.floor(seconds / 3600);
    var rm = Math.floor((seconds % 3600) / 60);
    return rm > 0 ? h + 'h ' + rm + 'm' : h + 'h';
}

function periodLabelText(period) {
    var r = getDateRange(period);
    if (period === 'all') { return 'All time'; }
    return formatDate(r.start) + ' – ' + formatDate(r.end);
}

// ==================== STREAK CALCULATION ====================
function calcStreak(sessions) {
    if (!sessions.length) return 0;
    var dates = sessions.map(function(s) { return s.date; });
    var unique = Array.from(new Set(dates)).sort().reverse();
    var today  = new Date().toISOString().split('T')[0];
    var streak = 0;
    var cursor = new Date(today);
    for (var i = 0; i < unique.length; i++) {
        var expected = cursor.toISOString().split('T')[0];
        if (unique[i] === expected) {
            streak++;
            cursor.setDate(cursor.getDate() - 1);
        } else {
            break;
        }
    }
    return streak;
}

// ==================== FILTER SESSIONS ====================
function filterSessions(period) {
    var range = getDateRange(period);
    return allSessions.filter(function(s) {
        if (!s.startTime) return false;
        var d = s.startTime.toDate ? s.startTime.toDate() : new Date(s.startTime);
        return d >= range.start && d <= range.end;
    });
}

// ==================== RENDER STATS ====================
function renderStats(sessions) {
    var totalSec  = sessions.reduce(function(a, s) { return a + (s.durationSeconds || 0); }, 0);
    var totalHrs  = (totalSec / 3600).toFixed(1);
    var tools     = new Set(sessions.map(function(s) { return s.tool; })).size;
    var streak    = calcStreak(allSessions); // Streak always from all-time data

    document.getElementById('statHours').textContent    = totalHrs;
    document.getElementById('statSessions').textContent = sessions.length;
    document.getElementById('statTools').textContent    = tools;
    document.getElementById('statStreak').textContent   = streak;
}

// ==================== RENDER TOOL CHART ====================
function renderToolChart(sessions) {
    var toolTotals = {};
    sessions.forEach(function(s) {
        toolTotals[s.tool] = (toolTotals[s.tool] || 0) + (s.durationSeconds || 0);
    });

    var sorted = Object.entries(toolTotals).sort(function(a, b) { return b[1] - a[1]; });
    var labels  = sorted.map(function(x) { return x[0]; });
    var values  = sorted.map(function(x) { return parseFloat((x[1] / 60).toFixed(1)); });

    // Set chart height dynamically based on number of tools
    var toolChartWrapper = document.getElementById('toolChart').parentElement;
    var barHeight = 32;
    var chartHeight = Math.max(220, labels.length * barHeight + 60);
    toolChartWrapper.style.height = chartHeight + 'px';

    var ctx = document.getElementById('toolChart').getContext('2d');
    if (toolChartInst) { toolChartInst.destroy(); }

    if (!labels.length) {
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.fillStyle = '#adb5bd';
        ctx.font = '13px Plus Jakarta Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No data for this period', ctx.canvas.width / 2, 110);
        return;
    }

    toolChartInst = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Minutes',
                data: values,
                backgroundColor: 'rgba(43, 138, 156, 0.8)',
                borderColor: '#2B8A9C',
                borderWidth: 1.5,
                borderRadius: 5
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(ctx) {
                            return ' ' + ctx.parsed.x + ' min';
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { color: '#f1f3f5' },
                    ticks: {
                        font: { size: 11, family: 'Plus Jakarta Sans, sans-serif' },
                        color: '#6c757d'
                    },
                    title: {
                        display: true,
                        text: 'Minutes',
                        font: { size: 11 },
                        color: '#6c757d'
                    }
                },
                y: {
                    ticks: {
                        font: { size: 10, family: 'Plus Jakarta Sans, sans-serif' },
                        color: '#495057'
                    }
                }
            }
        }
    });
}

// ==================== RENDER TIMELINE CHART ====================
function renderTimelineChart(sessions, period) {
    var ctx = document.getElementById('timelineChart').getContext('2d');
    if (timelineChartInst) { timelineChartInst.destroy(); }

    if (!sessions.length) {
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.fillStyle = '#adb5bd';
        ctx.font = '13px Plus Jakarta Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No data for this period', ctx.canvas.width / 2, 110);
        return;
    }

    // Group by day
    var dayTotals = {};
    sessions.forEach(function(s) {
        var d = s.date || (s.startTime && s.startTime.toDate ? s.startTime.toDate().toISOString().split('T')[0] : null);
        if (d) { dayTotals[d] = (dayTotals[d] || 0) + (s.durationSeconds || 0); }
    });

    var range   = getDateRange(period);
    var days    = [];
    var cursor  = new Date(range.start);
    cursor.setHours(0,0,0,0);
    var endDay  = new Date(range.end);
    endDay.setHours(0,0,0,0);

    // Build a label for every day in the range (up to 90 days)
    var maxDays = 90;
    var count   = 0;
    while (cursor <= endDay && count < maxDays) {
        days.push(cursor.toISOString().split('T')[0]);
        cursor.setDate(cursor.getDate() + 1);
        count++;
    }

    // If range > 30 days, group by week instead
    var useWeeks = days.length > 30;
    var labels, values;

    if (useWeeks) {
        var weekTotals = {};
        days.forEach(function(d) {
            // ISO week start (Monday)
            var dt = new Date(d);
            var day = dt.getDay();
            var diff = dt.getDate() - day + (day === 0 ? -6 : 1);
            var weekStart = new Date(dt.setDate(diff));
            var wk = weekStart.toISOString().split('T')[0];
            weekTotals[wk] = (weekTotals[wk] || 0) + ((dayTotals[d] || 0) / 60);
        });
        var wkKeys = Object.keys(weekTotals).sort();
        labels = wkKeys.map(function(d) { return formatShortDate(new Date(d)); });
        values = wkKeys.map(function(d) { return parseFloat(weekTotals[d].toFixed(1)); });
    } else {
        labels = days.map(function(d) { return formatShortDate(new Date(d + 'T12:00:00')); });
        values = days.map(function(d) { return parseFloat(((dayTotals[d] || 0) / 60).toFixed(1)); });
    }

    timelineChartInst = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Minutes',
                data: values,
                backgroundColor: 'rgba(43, 138, 156, 0.75)',
                borderColor: '#2B8A9C',
                borderWidth: 1,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(ctx) {
                            return ' ' + ctx.parsed.y + ' min';
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: {
                        font: { size: 10, family: 'Plus Jakarta Sans, sans-serif' },
                        color: '#6c757d',
                        maxRotation: 45,
                        maxTicksLimit: 12
                    }
                },
                y: {
                    grid: { color: '#f1f3f5' },
                    ticks: {
                        font: { size: 11, family: 'Plus Jakarta Sans, sans-serif' },
                        color: '#6c757d'
                    },
                    title: {
                        display: true,
                        text: 'Minutes',
                        font: { size: 11 },
                        color: '#6c757d'
                    }
                }
            }
        }
    });
}

// ==================== RENDER TABLE ====================
function renderTable(sessions) {
    var badge = document.getElementById('sessionCountBadge');
    badge.textContent = sessions.length + ' session' + (sessions.length !== 1 ? 's' : '');

    var container = document.getElementById('tableBody');

    if (!sessions.length) {
        container.innerHTML = '<div class="empty-state"><i class="bi bi-hourglass"></i><p>No sessions in this period yet.<br>Start using a tool to build your log.</p></div>';
        return;
    }

    // Sort newest first
    var sorted = sessions.slice().sort(function(a, b) {
        var da = a.startTime && a.startTime.toDate ? a.startTime.toDate() : new Date(0);
        var db = b.startTime && b.startTime.toDate ? b.startTime.toDate() : new Date(0);
        return db - da;
    });

    var rows = sorted.map(function(s) {
        var d   = s.startTime && s.startTime.toDate ? s.startTime.toDate() : new Date(0);
        var dur = formatDuration(s.durationSeconds || 0);
        var dateStr = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        var timeStr = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        return '<tr>' +
               '<td>' + dateStr + '<br><span style="font-size:0.75rem;color:var(--color-gray-500);">' + timeStr + '</span></td>' +
               '<td><span class="tool-pill">' + escapeHtml(s.tool) + '</span></td>' +
               '<td class="duration-text">' + dur + '</td>' +
               '</tr>';
    }).join('');

    container.innerHTML = '<table class="sessions-table">' +
        '<thead><tr><th>Date</th><th>Tool</th><th>Duration</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '</table>';
}

function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ==================== FULL RENDER ====================
function renderAll(period) {
    filteredSessions = filterSessions(period);

    document.getElementById('periodLabel').textContent = periodLabelText(period);

    renderStats(filteredSessions);
    renderToolChart(filteredSessions);
    renderTimelineChart(filteredSessions, period);
    renderTable(filteredSessions);
}

document.querySelectorAll('.quick-btn').forEach(function(btn) {

        document.querySelectorAll('.quick-btn').forEach(function(b) { b.classList.remove('active'); });

document.getElementById('applyCustom').addEventListener('click', function() {
    var s = document.getElementById('customStart').value;
    var e = document.getElementById('customEnd').value;
    if (!s || !e) {
        alert('Please select both a start and end date.');
        return;
    }
    customStartDate = new Date(s);
    customEndDate   = new Date(e);
    if (customStartDate > customEndDate) {
        alert('Start date must be before end date.');
        return;
    }
    document.querySelectorAll('.quick-btn').forEach(function(b) { b.classList.remove('active'); });
    activeFilter = 'custom';
    renderAll('custom');
});

// ==================== PDF EXPORT ====================
document.getElementById('exportBtn').addEventListener('click', function() {
    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Generating...';

    try {
        exportPDF();
    } catch(e) {
        console.error('PDF export error:', e);
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-file-earmark-pdf"></i> Export CPD Report (PDF)';
    }
});

function exportPDF() {
    var { jsPDF } = window.jspdf;
    var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    var pw = 210;   // page width mm
    var ph = 297;   // page height mm
    var m  = 15;    // margin mm
    var iw = pw - m * 2;
    var y  = m;

    var teal  = [43, 138, 156];
    var navy  = [52, 58, 64];
    var gray  = [108, 117, 125];
    var lgray = [233, 236, 239];
    var white = [255, 255, 255];

    // ── HEADER BAR ──
    doc.setFillColor(...teal);
    doc.rect(0, 0, pw, 22, 'F');
    doc.setTextColor(...white);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text('Paramind', m, 14);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.text('CPD Activity Report', m + 32, 14);
    y = 30;

    // ── PERIOD ──
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(...navy);
    doc.text('Period: ' + periodLabelText(activeFilter), m, y);
    y += 5;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(...gray);
    doc.text('Generated: ' + new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }), m, y);
    y += 8;

    // ── STATS ROW ──
    doc.setDrawColor(...lgray);
    doc.line(m, y, pw - m, y);
    y += 5;

    var totalSec = filteredSessions.reduce(function(a, s) { return a + (s.durationSeconds || 0); }, 0);
    var stats = [
        { label: 'Hours Studied',  value: (totalSec / 3600).toFixed(1) },
        { label: 'Sessions',       value: filteredSessions.length.toString() },
        { label: 'Tools Used',     value: new Set(filteredSessions.map(function(s) { return s.tool; })).size.toString() },
        { label: 'Day Streak',     value: calcStreak(allSessions).toString() }
    ];
    var colW = iw / 4;
    stats.forEach(function(stat, i) {
        var x = m + i * colW + colW / 2;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(18);
        doc.setTextColor(...teal);
        doc.text(stat.value, x, y + 8, { align: 'center' });
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.setTextColor(...gray);
        doc.text(stat.label, x, y + 14, { align: 'center' });
    });
    y += 22;

    doc.setDrawColor(...lgray);
    doc.line(m, y, pw - m, y);
    y += 6;

    // ── CHARTS ──
    var toolCanvas     = document.getElementById('toolChart');
    var timelineCanvas = document.getElementById('timelineChart');

    if (toolCanvas && timelineCanvas) {
        try {
            var chartH = 42;
            var halfW  = (iw - 4) / 2;

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(9);
            doc.setTextColor(...navy);
            doc.text('Time by Tool', m, y);
            doc.text('Activity Over Time', m + halfW + 4, y);
            y += 3;

            var toolImg     = toolCanvas.toDataURL('image/png');
            var timelineImg = timelineCanvas.toDataURL('image/png');
            doc.addImage(toolImg,     'PNG', m,               y, halfW, chartH);
            doc.addImage(timelineImg, 'PNG', m + halfW + 4,  y, halfW, chartH);
            y += chartH + 6;
        } catch(e) {
            console.warn('Chart capture failed:', e);
            y += 6;
        }
    }

    doc.setDrawColor(...lgray);
    doc.line(m, y, pw - m, y);
    y += 5;

    // ── SESSIONS TABLE ──
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.setTextColor(...navy);
    doc.text('Session Log', m, y);
    y += 5;

    // Table header
    var cols = [{ label: 'Date',     x: m,       w: 40 },
                { label: 'Tool',     x: m + 40,  w: 80 },
                { label: 'Duration', x: m + 120, w: 30 }];

    doc.setFillColor(...teal);
    doc.rect(m, y, iw, 6, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(...white);
    cols.forEach(function(col) {
        doc.text(col.label, col.x + 2, y + 4.2);
    });
    y += 6;

    // Table rows
    var sorted = filteredSessions.slice().sort(function(a, b) {
        var da = a.startTime && a.startTime.toDate ? a.startTime.toDate() : new Date(0);
        var db = b.startTime && b.startTime.toDate ? b.startTime.toDate() : new Date(0);
        return db - da;
    });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    var rowH = 6;

    sorted.forEach(function(s, i) {
        if (y > ph - 25) {
            doc.addPage();
            y = m;
        }
        var d   = s.startTime && s.startTime.toDate ? s.startTime.toDate() : new Date(0);
        var dur = formatDuration(s.durationSeconds || 0);
        var dateStr = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

        if (i % 2 === 0) {
            doc.setFillColor(248, 249, 250);
            doc.rect(m, y, iw, rowH, 'F');
        }

        doc.setTextColor(...navy);
        doc.text(dateStr, cols[0].x + 2, y + 4.2);
        doc.text((s.tool || '').substring(0, 32), cols[1].x + 2, y + 4.2);
        doc.text(dur, cols[2].x + 2, y + 4.2);
        y += rowH;
    });

    y += 8;

    // ── FOOTER ──
    doc.setDrawColor(...lgray);
    doc.line(m, y, pw - m, y);
    y += 5;
    doc.setFont('helvetica', 'italic');
    doc.setFontSize(7.5);
    doc.setTextColor(...gray);
    doc.text('Paramind is an educational platform for UK paramedics. This report may be used as evidence of CPD activity for HCPC renewal.', m, y, { maxWidth: iw });
    y += 4;
    doc.text('Standard 6: Keep your professional knowledge and skills up to date. (HCPC Standards of Proficiency)', m, y, { maxWidth: iw });

    // ── SAVE (iOS-safe) ──
    var period = activeFilter === 'custom'
        ? (document.getElementById('customStart').value + '_to_' + document.getElementById('customEnd').value)
        : activeFilter;
    var fileName = 'Paramind_CPD_Activity_' + period + '.pdf';

    // iOS Safari: doc.save() doesn't work — open blob URL in new tab instead
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS) {
        var url = doc.output('bloburl');
        window.open(url, '_blank');
    } else {
        doc.save(fileName);
    }

    var btn = document.getElementById('exportBtn');
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-file-earmark-pdf"></i> Export CPD Report (PDF)';
}

// ==================== LOAD DATA FROM FIRESTORE ====================
waitForFirebase(function(ready) {
    if (!ready) {
        document.getElementById('loadingState').innerHTML =
            '<p style="color:var(--color-danger);">Could not connect to the database. Please refresh the page.</p>';
        return;
    }

    firebase.auth().onAuthStateChanged(function(user) {
        if (!user) { return; } // pro-guard.js handles redirect

        firebase.firestore()
          .collection('users').doc(user.uid)
          .collection('activityLog')
          .orderBy('startTime', 'desc')
          .get()
          .then(function(snapshot) {
              // Map old tool names to new display names for legacy sessions
              var TOOL_NAME_MAP = {
                  'Chat with Hollie':  'Paramedic Q&A',
                  'Patient Scenarios': 'Clinical Patient Simulations',
                  'Differentials Tool':'Exploring Differentials',
                  'Podcast':           'Paramind Podcasts',
                  'ECG Tool':          'Understanding ECGs'
              };

              // Tools excluded from CPD reporting
              var EXCLUDED_TOOLS = ['CPD Portfolio'];

              allSessions = [];
              snapshot.forEach(function(doc) {
                  var d = doc.data();
                  if (!d.durationSeconds || d.durationSeconds <= 0) { return; }
                  if (EXCLUDED_TOOLS.indexOf(d.tool) !== -1) { return; }
                  // Remap legacy name if needed
                  if (TOOL_NAME_MAP[d.tool]) { d.tool = TOOL_NAME_MAP[d.tool]; }
                  allSessions.push(d);
              });

              document.getElementById('loadingState').style.display = 'none';
              document.getElementById('mainContent').style.display  = 'block';

              renderAll('month');
          })
          .catch(function(e) {
              console.error('Failed to load activity log:', e);
              document.getElementById('loadingState').innerHTML =
                  '<p style="color:var(--color-danger);">Failed to load activity data. Please try again.</p>';
          });
    });
});
</script>
