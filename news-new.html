    <style>
        /* ================================================================
           PARAMIND — PARAMEDIC NEWS (public page, no login needed)
           Shows the latest news round-up from social/latest.json.
           That file is written by the Mon/Wed/Fri news run.
           ================================================================ */
        .landing-page { min-height: 100vh; background: #FFFFFF; overflow-x: hidden; position: relative; }
        .landing-container { max-width: 920px; margin: 0 auto; padding: 0.5rem 1rem 3rem; position: relative; z-index: 1; }

        /* Section header (same coloured strip as the What's new page) */
        .section-header {
            background: linear-gradient(135deg, #0F4252 0%, #2B8A9C 60%, #1F6B7C 100%);
            border-radius: 18px;
            padding: 1.5rem 1.75rem;
            margin-top: 0.75rem;
            margin-bottom: 1.5rem;
            color: #fff;
            box-shadow: 0 6px 18px rgba(15, 66, 82, 0.10);
        }
        .section-header-label {
            font-family: 'JetBrains Mono', 'DM Sans', monospace;
            font-size: 0.7rem; letter-spacing: 2.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.75);
            margin-bottom: 0.35rem;
        }
        .section-header-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2rem; font-weight: 700; line-height: 1;
            letter-spacing: -0.5px; margin: 0; color: #fff;
        }
        .section-header-tagline {
            font-size: 1rem; color: rgba(255,255,255,0.9);
            margin-top: 0.5rem; font-weight: 500;
        }

        /* Date line above the stories */
        .news-date {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-gray-600);
            margin: 0 0 1rem 0.25rem;
        }
        .news-date i { color: var(--color-teal); margin-right: 0.35rem; }

        /* Story cards */
        .news-list { display: flex; flex-direction: column; gap: 1rem; }
        .news-card {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 2px 8px rgba(15, 66, 82, 0.04);
        }
        .news-card-region {
            font-family: 'JetBrains Mono', 'DM Sans', monospace;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--color-teal);
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .news-card-headline {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--color-gray-800);
            margin: 0 0 0.6rem 0;
        }
        .news-card-body {
            font-size: 0.98rem;
            line-height: 1.6;
            color: var(--color-gray-700);
            margin: 0 0 0.9rem 0;
        }
        .news-card-why {
            background: rgba(43, 138, 156, 0.07);
            border-left: 4px solid #2B8A9C;
            border-radius: 0 10px 10px 0;
            padding: 0.7rem 0.9rem;
            margin-bottom: 0.9rem;
        }
        .news-card-why-label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #1F6B7C;
            margin-bottom: 0.15rem;
        }
        .news-card-why-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--color-gray-800);
            margin: 0;
        }
        .news-card-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1rem;
        }
        .news-card-source {
            font-size: 0.82rem;
            color: var(--color-gray-600);
        }
        .news-card-link {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-teal);
            text-decoration: none;
        }
        .news-card-link:hover { color: var(--color-teal-dark); text-decoration: underline; }

        /* Small print under the stories */
        .news-footnote {
            font-size: 0.82rem;
            color: var(--color-gray-600);
            text-align: center;
            margin: 1.5rem 0 0 0;
            line-height: 1.5;
        }

        /* Loading + message states */
        .loading-spinner { display: flex; justify-content: center; padding: 3rem 0; color: var(--color-teal); }
        .news-message {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--color-gray-600);
        }
        .news-message i { font-size: 2rem; color: var(--color-gray-500); display: block; margin-bottom: 0.5rem; }

        @media (max-width: 540px) {
            .section-header-title { font-size: 1.6rem; }
            .news-card { padding: 1rem; }
            .news-card-headline { font-size: 1.08rem; }
        }
    </style>
</head>

<body class="landing-page member-page">

                <a class="navbar-brand" href="landing.html">

                <span></span><span></span><span></span>

    <div class="landing-container">

        <div class="section-header">

        <!-- Main content area — the script below swaps between loading / stories / message -->

            </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/menu-v2.js"></script>

    <script>
        // ============================================================
        // PARAMEDIC NEWS
        // Reads social/latest.json (the newest news round-up) and
        // draws one card per story. No login and no Firebase needed.
        // ============================================================
        (function () {
            'use strict';

            var content = document.getElementById('newsContent');

            // Make text safe to put on the page
            function escapeHtml(text) {
                return String(text == null ? '' : text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            // Only allow normal web links (https:// or http://)
            function safeLink(link) {
                if (typeof link !== 'string') return '';
                var trimmed = link.trim();
                return /^https?:\/\//i.test(trimmed) ? trimmed : '';
            }

            function showMessage(icon, text) {
                content.innerHTML =
                    '<div class="news-message">' +
                        '<i class="bi ' + icon + '"></i>' +
                        '<div>' + escapeHtml(text) + '</div>' +
                    '</div>';
            }

            function storyCard(story) {
                var link = safeLink(story.link);
                var html = '<article class="news-card">';

                if (story.region) {
                    html += '<div class="news-card-region">' + escapeHtml(story.region) + '</div>';
                }
                html += '<h2 class="news-card-headline">' + escapeHtml(story.headline) + '</h2>';
                if (story.body) {
                    html += '<p class="news-card-body">' + escapeHtml(story.body) + '</p>';
                }
                if (story.why) {
                    html += '<div class="news-card-why">' +
                                '<div class="news-card-why-label">Why it matters</div>' +
                                '<p class="news-card-why-text">' + escapeHtml(story.why) + '</p>' +
                            '</div>';
                }

                html += '<div class="news-card-footer">';
                html += '<span class="news-card-source">' +
                            (story.source ? 'Source: ' + escapeHtml(story.source) : '') +
                        '</span>';
                if (link) {
                    html += '<a class="news-card-link" href="' + escapeHtml(link) + '" target="_blank" rel="noopener noreferrer">' +
                                'Read the full story <i class="bi bi-box-arrow-up-right"></i>' +
                            '</a>';
                }
                html += '</div>';

                html += '</article>';
                return html;
            }

            function render(data) {
                var stories = (data && Array.isArray(data.stories)) ? data.stories : [];
                stories = stories.filter(function (s) { return s && s.headline; });

                if (stories.length === 0) {
                    showMessage('bi-newspaper', 'No news stories to show just yet. Please check back soon.');
                    return;
                }

                var html = '';
                if (data.date) {
                    html += '<p class="news-date"><i class="bi bi-calendar3"></i>' + escapeHtml(data.date) + '</p>';
                }
                html += '<div class="news-list">';
                stories.forEach(function (story) { html += storyCard(story); });
                html += '</div>';
                html += '<p class="news-footnote">Summaries are written by Paramind from the sources shown. ' +
                        'Follow the link on each story to read the original.</p>';

                content.innerHTML = html;
            }

            // The "?t=" on the end makes sure we always get the newest file
            fetch('social/latest.json?t=' + Date.now(), { cache: 'no-store' })
                .then(function (response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(render)
                .catch(function (error) {
                    console.warn('Paramedic news: could not load the latest stories', error);
                    showMessage('bi-wifi-off', 'Sorry, the news could not be loaded. Please check your connection and try again.');
                });
        })();
    </script>
