<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>CPD Portfolio | Paramind</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Menu CSS -->
    <link rel="stylesheet" href="css/menu-v2.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        /* ==================== CPD PAGE STYLES ==================== */
        .cpd-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--color-gray-50);
        }
        
        /* Navbar */
        .cpd-navbar {
            background: var(--color-white);
            border-bottom: 1px solid var(--color-gray-200);
            padding: 0.75rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }
        
        .cpd-navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        /* Main Container */
        .main-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }
        
        /* Page Header */
        .page-header {
            background: var(--color-white);
            padding: 1.5rem;
            border-bottom: 1px solid var(--color-gray-200);
            text-align: center;
        }
        
        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-gray-800);
            margin: 0 0 0.25rem 0;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .page-header p {
            color: var(--color-gray-500);
            margin: 0;
            font-size: 0.9rem;
        }
        
        .pro-badge {
            background: linear-gradient(135deg, var(--color-teal) 0%, var(--color-green) 100%);
            color: white;
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* ==================== EMPTY STATE ==================== */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--color-gray-500);
        }
        
        .empty-state.hidden {
            display: none;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.4;
        }
        
        .empty-state h3 {
            color: var(--color-gray-700);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .empty-state p {
            margin-bottom: 1.5rem;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .empty-state .btn {
            background: linear-gradient(135deg, var(--color-teal) 0%, var(--color-teal-dark) 100%);
            border: none;
            color: white;
        }
        
        /* ==================== CPD RECORDS LIST ==================== */
        .cpd-content {
            padding: 1rem;
        }
        
        .cpd-list {
            max-width: 700px;
            margin: 0 auto;
        }
        
        .cpd-list.hidden {
            display: none;
        }
        
        /* Loading State */
        .cpd-loading {
            text-align: center;
            padding: 3rem;
            color: var(--color-gray-500);
        }
        
        .cpd-loading .spinner-border {
            width: 2.5rem;
            height: 2.5rem;
            margin-bottom: 1rem;
            color: var(--color-teal);
        }
        
        /* ==================== CPD RECORD CARD ==================== */
        .cpd-record {
            background: var(--color-white);
            border: 1px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }
        
        .cpd-record:hover {
            box-shadow: var(--shadow-md);
        }
        
        .cpd-record-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }
        
        .cpd-record-date {
            font-size: 0.8rem;
            color: var(--color-gray-500);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        
        .cpd-record-result {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .cpd-record-result.correct {
            background: rgba(92, 184, 92, 0.15);
            color: #3d8b3d;
        }
        
        .cpd-record-result.partially-correct {
            background: rgba(240, 173, 78, 0.15);
            color: #c77c00;
        }
        
        .cpd-record-result.incorrect {
            background: rgba(217, 83, 79, 0.15);
            color: #c9302c;
        }
        
        .cpd-record-title {
            font-weight: 600;
            color: var(--color-gray-800);
            font-size: 1.05rem;
            margin-bottom: 0.25rem;
        }
        
        .cpd-record-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--color-gray-500);
            margin-bottom: 0.75rem;
        }
        
        .cpd-record-details {
            background: var(--color-gray-50);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
        }
        
        .cpd-record-details .detail-row {
            margin-bottom: 0.35rem;
        }
        
        .cpd-record-details .detail-row:last-child {
            margin-bottom: 0;
        }
        
        .cpd-record-details .detail-label {
            color: var(--color-gray-500);
            font-weight: 500;
        }
        
        .cpd-record-details .detail-value {
            color: var(--color-gray-800);
        }
        
        .cpd-record-stats {
            display: flex;
            gap: 1.25rem;
            font-size: 0.8rem;
            color: var(--color-gray-500);
            margin-bottom: 0.75rem;
        }
        
        .cpd-record-stat {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        
        .cpd-record-stat i {
            color: var(--color-teal);
        }
        
        .cpd-record-actions {
            display: flex;
            gap: 0.5rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--color-gray-200);
        }
        
        .cpd-record-actions .btn {
            flex: 1;
            font-size: 0.85rem;
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius-md);
        }
        
        .cpd-record-actions .btn-certificate {
            background: var(--color-teal);
            border-color: var(--color-teal);
            color: white;
        }
        
        .cpd-record-actions .btn-certificate:hover {
            background: var(--color-teal-dark);
            border-color: var(--color-teal-dark);
        }
        
        .cpd-record-actions .btn-delete {
            background: transparent;
            border: 1px solid var(--color-gray-300);
            color: var(--color-gray-600);
        }
        
        .cpd-record-actions .btn-delete:hover {
            background: #dc3545;
            border-color: #dc3545;
            color: white;
        }
        
        /* Mobile adjustments */
        @media (max-width: 576px) {
            .cpd-record-actions {
                flex-direction: column;
            }
            
            .cpd-record-stats {
                flex-wrap: wrap;
                gap: 0.75rem;
            }
            
            .page-header {
                padding: 1rem;
            }
            
            .page-header h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body class="cpd-page">
    <!-- ==================== NAVIGATION ==================== -->
    <nav class="cpd-navbar">
        <div class="container">
            <span class="brand-text">
                <a class="navbar-brand" href="landing.html">
                    <span class="brand-para">para</span><span class="brand-mind">mind</span>
                </a>
            </span>
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- ==================== MAIN CONTAINER ==================== -->
    <div class="main-container">
        
        <!-- Page Header -->
        <div class="page-header">
            <h2>
                <i class="bi bi-award"></i>
                CPD Portfolio
                
            </h2>
            <p>Your completed learning scenarios and certificates</p>
        </div>
        
        <!-- CPD Content (Pro users - pro-guard.js ensures access) -->
        <div class="cpd-content" id="cpdContent">
            
            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <i class="bi bi-journal-medical"></i>
                <h3>No CPD Records Yet</h3>
                <p>Complete a scenario and submit your working impression to earn your first CPD record.</p>
                <a href="scenarios.html" class="btn">
                    <i class="bi bi-mortarboard me-2"></i>Browse Scenarios
                </a>
            </div>
            
            <!-- CPD Records List -->
            <div class="cpd-list" id="cpdList">
                <!-- Records will be populated by JavaScript -->
            </div>
            
        </div>
        
    </div>

    <!-- ==================== SCRIPTS ==================== -->
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jsPDF for certificate generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Page Script -->
    <script>
        // ==================== API CONFIG ====================
        const API_CONFIG = {
            get baseUrl() {
                return window.paramind?.CONFIG?.api?.baseUrl || 'https://europe-west2-paramind-64b8e.cloudfunctions.net';
            }
        };

        // ==================== STATE ====================
        const pageState = {
            userName: 'ParaMind User'
        };

        // ==================== DOM ELEMENTS ====================
        const elements = {
            cpdContent: document.getElementById('cpdContent'),
            emptyState: document.getElementById('emptyState'),
            cpdList: document.getElementById('cpdList')
        };

        // ==================== INIT (waits for Firebase from menu-v2.js) ====================
        function initCPD() {
            // Wait for Firebase to be ready (loaded by menu-v2.js)
            if (typeof firebase === 'undefined' || !firebase.auth || !firebase.apps || !firebase.apps.length) {
                setTimeout(initCPD, 150);
                return;
            }
            
            const user = firebase.auth().currentUser;
            if (!user) {
                // pro-guard.js should have already redirected, but just in case
                setTimeout(initCPD, 200);
                return;
            }
            
            // Get user name for certificates
            firebase.firestore().collection('users').doc(user.uid).get()
                .then(function(doc) {
                    if (doc.exists) {
                        const userData = doc.data();
                        const firstName = userData.firstName || userData.firstname || '';
                        const surname = userData.surname || userData.lastName || '';
                        const fullName = (firstName + ' ' + surname).trim();
                        if (fullName) {
                            pageState.userName = fullName;
                        }
                    }
                })
                .catch(function(error) {
                    console.error('Error fetching user data:', error);
                });
            
            // Load CPD records
            loadCpdRecords();
        }
        
        document.addEventListener('DOMContentLoaded', initCPD);

        // ==================== LOAD CPD RECORDS ====================
        async function loadCpdRecords() {
            // Show loading state
            elements.cpdList.innerHTML = `
                <div class="cpd-loading">
                    <div class="spinner-border" role="status"></div>
                    <p>Loading your CPD records...</p>
                </div>
            `;
            elements.cpdList.classList.remove('hidden');
            elements.emptyState.classList.add('hidden');
            
            try {
                const user = firebase.auth().currentUser;
                if (!user) throw new Error('Not authenticated');
                
                const token = await user.getIdToken();
                
                const response = await fetch(`${API_CONFIG.baseUrl}/getCpdRecords`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load CPD records');
                }
                
                const data = await response.json();
                displayCpdRecords(data.records || []);
                
            } catch (error) {
                console.error('Error loading CPD records:', error);
                elements.cpdList.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-circle me-2"></i>
                        Failed to load CPD records. Please try again.
                    </div>
                `;
            }
        }

        // ==================== DISPLAY CPD RECORDS ====================
        function displayCpdRecords(records) {
            if (records.length === 0) {
                elements.cpdList.classList.add('hidden');
                elements.emptyState.classList.remove('hidden');
                return;
            }
            
            elements.emptyState.classList.add('hidden');
            elements.cpdList.classList.remove('hidden');
            
            let html = '';
            
            records.forEach(record => {
                const date = record.completedAt 
                    ? new Date(record.completedAt._seconds * 1000) 
                    : new Date();
                const formattedDate = date.toLocaleDateString('en-GB', {
                    day: 'numeric',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                const resultClass = record.result === 'correct' ? 'correct' : 
                                   record.result === 'partially_correct' ? 'partially-correct' : 'incorrect';
                const resultText = record.result === 'correct' ? 'Correct' : 
                                  record.result === 'partially_correct' ? 'Partially Correct' : 'Incorrect';
                
                html += `
                    <div class="cpd-record" data-record-id="${record.id}">
                        <div class="cpd-record-header">
                            <span class="cpd-record-date">
                                <i class="bi bi-calendar3"></i>
                                ${formattedDate}
                            </span>
                            <span class="cpd-record-result ${resultClass}">${resultText}</span>
                        </div>
                        <div class="cpd-record-title">${escapeHtml(record.scenarioType || 'Clinical Scenario')}</div>
                        <div class="cpd-record-code">
                            <i class="bi bi-hash"></i>${escapeHtml(record.scenarioCode || 'N/A')}
                        </div>
                        <div class="cpd-record-details">
                            <div class="detail-row">
                                <span class="detail-label">Your impression:</span>
                                <span class="detail-value">${escapeHtml(record.userImpression || 'N/A')}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Actual diagnosis:</span>
                                <span class="detail-value">${escapeHtml(record.correctDiagnosis || 'N/A')}</span>
                            </div>
                        </div>
                        <div class="cpd-record-stats">
                            <span class="cpd-record-stat">
                                <i class="bi bi-chat-dots"></i>
                                ${record.questionsAsked || 0} questions
                            </span>
                            <span class="cpd-record-stat">
                                <i class="bi bi-clipboard2-pulse"></i>
                                ${record.assessmentsPerformed || 0} assessments
                            </span>
                        </div>
                        <div class="cpd-record-actions">
                            <button class="btn btn-certificate" onclick="downloadCertificate('${record.id}')">
                                <i class="bi bi-download me-1"></i>Download Certificate
                            </button>
                            <button class="btn btn-delete" onclick="deleteRecord('${record.id}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            elements.cpdList.innerHTML = html;
        }

        // ==================== HELPER: ESCAPE HTML ====================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== DOWNLOAD CERTIFICATE ====================
        async function downloadCertificate(recordId) {
            try {
                const user = firebase.auth().currentUser;
                if (!user) throw new Error('Not authenticated');
                
                const token = await user.getIdToken();
                
                // Fetch records to find this one
                const response = await fetch(`${API_CONFIG.baseUrl}/getCpdRecords`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) throw new Error('Failed to fetch record');
                
                const data = await response.json();
                const record = data.records.find(r => r.id === recordId);
                
                if (!record) throw new Error('Record not found');
                
                // Try to get latest user name from API
                try {
                    const userResponse = await fetch(`${API_CONFIG.baseUrl}/user`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    if (userResponse.ok) {
                        const userData = await userResponse.json();
                        const firstName = userData.firstName || userData.firstname || '';
                        const surname = userData.surname || userData.lastName || '';
                        const fullName = `${firstName} ${surname}`.trim();
                        if (fullName) {
                            pageState.userName = fullName;
                        }
                    }
                } catch (e) {
                    console.log('Using cached user name');
                }
                
                // Generate the PDF
                generateCertificatePdf(record, pageState.userName);
                
            } catch (error) {
                console.error('Error downloading certificate:', error);
                alert('Failed to download certificate. Please try again.');
            }
        }

        // ==================== GENERATE CERTIFICATE PDF ====================
        function generateCertificatePdf(record, userName) {
            const { jsPDF } = window.jspdf;
            
            // Create PDF in landscape A4
            const doc = new jsPDF({
                orientation: 'landscape',
                unit: 'mm',
                format: 'a4'
            });
            
            const pageWidth = doc.internal.pageSize.getWidth();  // 297mm
            const pageHeight = doc.internal.pageSize.getHeight(); // 210mm
            const centerX = pageWidth / 2;
            
            // Colors
            const teal = [43, 138, 156];
            const green = [92, 184, 92];
            const darkBlue = [26, 26, 46];
            const gray = [108, 117, 125];
            
            // ===== BORDERS =====
            doc.setDrawColor(...teal);
            doc.setLineWidth(3);
            doc.rect(10, 10, pageWidth - 20, pageHeight - 20);
            
            doc.setDrawColor(...green);
            doc.setLineWidth(1);
            doc.rect(15, 15, pageWidth - 30, pageHeight - 30);
            
            // ===== HEADER =====
            doc.setFontSize(32);
            doc.setTextColor(...teal);
            doc.setFont('helvetica', 'bold');
            doc.text('CERTIFICATE OF COMPLETION', centerX, 38, { align: 'center' });
            
            doc.setFontSize(14);
            doc.setTextColor(...gray);
            doc.setFont('helvetica', 'normal');
            doc.text('Continuing Professional Development', centerX, 48, { align: 'center' });
            
            // Decorative line
            doc.setDrawColor(...teal);
            doc.setLineWidth(0.5);
            doc.line(centerX - 60, 53, centerX + 60, 53);
            
            // ===== CERTIFICATION TEXT =====
            doc.setFontSize(12);
            doc.setTextColor(...gray);
            doc.text('This certifies that', centerX, 65, { align: 'center' });
            
            // User name - BIG AND BOLD
            doc.setFontSize(26);
            doc.setTextColor(...darkBlue);
            doc.setFont('helvetica', 'bold');
            doc.text(userName, centerX, 78, { align: 'center' });
            
            doc.setFontSize(12);
            doc.setTextColor(...gray);
            doc.setFont('helvetica', 'normal');
            doc.text('has successfully completed the following clinical scenario:', centerX, 88, { align: 'center' });
            
            // ===== SCENARIO DETAILS =====
            doc.setFontSize(16);
            doc.setTextColor(...darkBlue);
            doc.setFont('helvetica', 'bold');
            doc.text(record.scenarioType || 'Clinical Scenario', centerX, 100, { align: 'center' });
            
            doc.setFontSize(10);
            doc.setTextColor(...gray);
            doc.setFont('helvetica', 'normal');
            doc.text(`Scenario Reference: ${record.scenarioCode || 'N/A'}`, centerX, 108, { align: 'center' });
            
            // ===== RESULT BADGE =====
            const resultColor = record.result === 'correct' ? green : 
                               record.result === 'partially_correct' ? [240, 173, 78] : [217, 83, 79];
            const resultText = record.result === 'correct' ? 'CORRECT' : 
                              record.result === 'partially_correct' ? 'PARTIALLY CORRECT' : 'INCORRECT';
            
            doc.setFillColor(...resultColor);
            doc.roundedRect(centerX - 25, 115, 50, 10, 2, 2, 'F');
            doc.setFontSize(9);
            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'bold');
            doc.text(resultText, centerX, 121.5, { align: 'center' });
            
            // ===== PERFORMANCE STATS =====
            doc.setFontSize(10);
            doc.setTextColor(...gray);
            doc.setFont('helvetica', 'normal');
            doc.text(`Questions Asked: ${record.questionsAsked || 0}  |  Assessments Performed: ${record.assessmentsPerformed || 0}`, centerX, 135, { align: 'center' });
            
            // ===== DATE =====
            const completedDate = record.completedAt 
                ? new Date(record.completedAt._seconds * 1000).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
                : new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            
            doc.setFontSize(11);
            doc.text(`Completed on: ${completedDate}`, centerX, 150, { align: 'center' });
            
            // ===== FOOTER =====
            doc.setFontSize(9);
            doc.setTextColor(...gray);
            doc.text('This certificate was generated by ParaMind - AI-Powered Paramedic Learning', centerX, 175, { align: 'center' });
            doc.text('www.paramind.co.uk', centerX, 181, { align: 'center' });
            
            // Certificate ID
            doc.setFontSize(7);
            doc.text(`Certificate ID: ${record.id}`, centerX, 190, { align: 'center' });
            
            // ===== SAVE =====
            const safeDate = completedDate.replace(/\s/g, '_').replace(/,/g, '');
            const fileName = `CPD_Certificate_${record.scenarioCode || 'N-A'}_${safeDate}.pdf`;
            doc.save(fileName);
        }

        // ==================== DELETE RECORD ====================
        async function deleteRecord(recordId) {
            if (!confirm('Are you sure you want to delete this CPD record? This cannot be undone.')) {
                return;
            }
            
            try {
                const user = firebase.auth().currentUser;
                if (!user) throw new Error('Not authenticated');
                
                const token = await user.getIdToken();
                
                // Note: API expects record ID as query parameter, not in body
                const response = await fetch(`${API_CONFIG.baseUrl}/deleteCpdRecord?id=${recordId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to delete record');
                }
                
                // Remove from DOM with animation
                const recordEl = document.querySelector(`[data-record-id="${recordId}"]`);
                if (recordEl) {
                    recordEl.style.transition = 'all 0.3s ease';
                    recordEl.style.opacity = '0';
                    recordEl.style.transform = 'translateX(100%)';
                    setTimeout(() => {
                        recordEl.remove();
                        
                        // Check if list is now empty
                        const remaining = elements.cpdList.querySelectorAll('.cpd-record');
                        if (remaining.length === 0) {
                            elements.cpdList.classList.add('hidden');
                            elements.emptyState.classList.remove('hidden');
                        }
                    }, 300);
                }
                
            } catch (error) {
                console.error('Error deleting record:', error);
                alert('Failed to delete record. Please try again.');
            }
        }

        // Make functions globally available
        window.downloadCertificate = downloadCertificate;
        window.deleteRecord = deleteRecord;
    </script>
