<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bone Lab | ParaMind</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Menu CSS -->
    <link rel="stylesheet" href="css/menu-v2.css">

    <style>
        /* ==================== CSS VARIABLES ==================== */
        :root {
            --color-teal: #2B8A9C;
            --color-teal-dark: #237282;
            --color-teal-light: #3DA4B8;
            --color-green: #5CB85C;
            --color-green-dark: #4A9A4A;
            --color-gray-50: #F8F9FA;
            --color-gray-100: #F1F3F5;
            --color-gray-200: #E9ECEF;
            --color-gray-300: #DEE2E6;
            --color-gray-400: #CED4DA;
            --color-gray-500: #ADB5BD;
            --color-gray-600: #6C757D;
            --color-gray-700: #495057;
            --color-gray-800: #343A40;
            --color-gray-900: #212529;
            --color-white: #FFFFFF;
            --color-danger: #DC3545;
            --color-warning: #E67E22;
            --color-amber: #f59e0b;
            --color-emerald: #10b981;
            --color-red: #ef4444;
            --font-primary: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --transition-fast: 0.2s ease;
            --header-height: 56px;
            --bone-fill: #F5F0E8;
            --bone-stroke: #C4B9A8;
            --bone-fill-dark: #EBE4D8;
            --bone-joint: #DDD5C5;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: var(--font-primary);
            background: var(--color-gray-50);
            color: var(--color-gray-800);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        /* ==================== APP SHELL ==================== */
        .app-shell { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

        /* ==================== NAVBAR (matches page-navbar) ==================== */
        .page-navbar {
            background: var(--color-white);
            border-bottom: 1px solid var(--color-gray-200);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 100;
            height: var(--header-height);
        }
        .brand-text { font-weight: 700; font-size: 1.4rem; text-decoration: none; }
        .brand-text a { text-decoration: none; }
        .brand-para { color: var(--color-teal); }
        .brand-mind { color: var(--color-green); }

        /* ==================== TOP BAR ==================== */
        .top-bar {
            flex-shrink: 0;
            background: var(--color-white);
            border-bottom: 1px solid var(--color-gray-200);
            padding: 8px 16px;
        }
        .mode-tabs {
            display: flex;
            background: var(--color-gray-100);
            border-radius: var(--radius-full);
            padding: 3px;
            margin-bottom: 8px;
        }
        .mode-tab {
            flex: 1; padding: 7px 12px; border: none; background: none;
            font-size: 0.82rem; font-weight: 600; color: var(--color-gray-500);
            border-radius: var(--radius-full); cursor: pointer;
            transition: all var(--transition-fast);
            display: flex; align-items: center; justify-content: center; gap: 5px;
            font-family: var(--font-primary);
        }
        .mode-tab.active {
            background: var(--color-white);
            color: var(--color-teal);
            box-shadow: var(--shadow-sm);
        }
        .control-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .view-toggle {
            display: flex;
            background: var(--color-gray-100);
            border-radius: var(--radius-full);
            padding: 2px;
        }
        .view-toggle-btn {
            padding: 5px 12px; border: none; background: none;
            font-size: 0.75rem; font-weight: 600; color: var(--color-gray-500);
            border-radius: var(--radius-full); cursor: pointer;
            transition: all var(--transition-fast); font-family: var(--font-primary);
        }
        .view-toggle-btn.active {
            background: var(--color-white);
            color: var(--color-gray-800);
            box-shadow: var(--shadow-sm);
        }
        .sub-mode-toggle { display: flex; gap: 4px; }
        .sub-mode-btn {
            padding: 5px 12px;
            border: 1.5px solid var(--color-gray-300);
            background: var(--color-white);
            font-size: 0.75rem; font-weight: 600; color: var(--color-gray-600);
            border-radius: var(--radius-full); cursor: pointer;
            transition: all var(--transition-fast); font-family: var(--font-primary);
        }
        .sub-mode-btn.active {
            border-color: var(--color-teal);
            background: var(--color-teal);
            color: white;
        }
        .score-badge { font-size: 0.82rem; color: var(--color-gray-600); font-weight: 600; }
        .score-badge strong { color: var(--color-gray-900); }

        /* ==================== SKELETON VIEWPORT ==================== */
        .skeleton-viewport {
            flex: 1; overflow: hidden; position: relative;
            background: linear-gradient(180deg, var(--color-gray-50) 0%, var(--color-gray-100) 100%);
        }
        .view-label {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--color-gray-500); z-index: 2;
            background: rgba(255,255,255,0.8); padding: 2px 10px; border-radius: var(--radius-full);
        }
        .skeleton-svg-wrap {
            height: 100%; display: flex; align-items: center;
            justify-content: center; padding: 8px;
        }
        .skeleton-svg-wrap svg { max-height: 100%; max-width: 100%; width: auto; height: auto; }

        /* ==================== BONE STYLING ==================== */
        .bone-group { cursor: pointer; }
        .bone-group .bone-shape {
            fill: var(--bone-fill); stroke: var(--bone-stroke); stroke-width: 0.8;
            stroke-linejoin: round;
            transition: fill 0.15s ease, stroke 0.15s ease, stroke-width 0.15s ease;
        }
        .bone-group .bone-detail { fill: none; stroke: var(--bone-joint); stroke-width: 0.5; pointer-events: none; opacity: 0.7; }
        .bone-group .bone-shading { fill: var(--bone-fill-dark); stroke: none; pointer-events: none; opacity: 0.4; }
        .bone-group:hover .bone-shape,
        .bone-group.hovered .bone-shape { fill: #D4F0F1; stroke: var(--color-teal); stroke-width: 1.5; }
        .bone-group.correct .bone-shape { fill: #bbf7d0; stroke: var(--color-emerald); stroke-width: 2; animation: correctPulse 0.5s ease; }
        .bone-group.incorrect .bone-shape { fill: #fecaca; stroke: var(--color-red); stroke-width: 2; animation: shake 0.4s ease; }
        .bone-group.highlighted .bone-shape { fill: #fef3c7; stroke: var(--color-amber); stroke-width: 2; animation: glowPulse 1.5s ease infinite; }

        @keyframes correctPulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
        @keyframes glowPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

        /* ==================== QUIZ FLOATING ==================== */
        .quiz-prompt-float {
            display: none; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            z-index: 10;
            background: linear-gradient(135deg, var(--color-teal) 0%, var(--color-teal-dark) 100%);
            color: white; border-radius: var(--radius-full);
            padding: 6px 16px; font-size: 0.82rem; font-weight: 700;
            box-shadow: var(--shadow-md); white-space: nowrap;
            text-align: center; max-width: 90%;
        }
        .quiz-prompt-float.visible { display: block; animation: fadeInDown 0.25s ease; }
        .quiz-prompt-float .find-label { font-weight: 400; opacity: 0.85; font-size: 0.72rem; }

        .quiz-score-float {
            display: none; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: rgba(255,255,255,0.95);
            border-radius: var(--radius-full); padding: 5px 12px;
            font-size: 0.78rem; font-weight: 600;
            box-shadow: var(--shadow-sm); gap: 12px; color: var(--color-gray-600);
        }
        .quiz-score-float.visible { display: flex; }
        .quiz-score-float .qs-correct { color: var(--color-emerald); }
        .quiz-score-float .qs-wrong { color: var(--color-red); }
        .quiz-score-float .qs-streak { color: var(--color-amber); }

        .quiz-flash {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%,-50%); z-index: 20;
            font-size: 3rem; pointer-events: none;
        }
        .quiz-flash.visible { display: block; animation: flashIn 0.6s ease forwards; }

        @keyframes flashIn { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); } 30% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); } 60% { transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

        /* ==================== SCENARIO BAR ==================== */
        .scenario-bar {
            display: none; position: absolute; top: 0; left: 0; right: 0; z-index: 5;
            background: rgba(255,255,255,0.95);
            border-bottom: 2px solid var(--color-amber);
            padding: 8px 12px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .scenario-bar.visible { display: block; animation: fadeInDown 0.25s ease; }
        .scenario-bar-badge {
            font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--color-amber);
            margin-bottom: 3px; display: flex; align-items: center; gap: 4px;
        }
        .scenario-bar-text {
            font-size: 0.82rem; line-height: 1.45; color: var(--color-gray-700);
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .scenario-bar-expand {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            background: var(--color-amber); color: white; border: none;
            border-radius: 50%; width: 28px; height: 28px; font-size: 0.8rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .scenario-bar-instruction {
            font-size: 0.72rem; color: var(--color-teal); font-weight: 600;
            margin-top: 3px; display: flex; align-items: center; gap: 4px;
        }

        /* ==================== BOTTOM SHEET ==================== */
        .sheet-backdrop {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35); z-index: 500;
            opacity: 0; transition: opacity 0.25s ease;
        }
        .sheet-backdrop.visible { display: block; opacity: 1; }
        .bottom-sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 501;
            background: var(--color-white);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
            max-height: 70vh; display: flex; flex-direction: column;
            padding-bottom: var(--safe-bottom);
        }
        .bottom-sheet.open { transform: translateY(0); }
        .sheet-handle {
            width: 36px; height: 4px; background: var(--color-gray-300);
            border-radius: 2px; margin: 8px auto 0; flex-shrink: 0;
        }
        .sheet-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px 6px; flex-shrink: 0;
        }
        .sheet-title { font-size: 1.05rem; font-weight: 700; color: var(--color-gray-900); }
        .sheet-close {
            background: var(--color-gray-100); border: none; border-radius: 50%;
            width: 32px; height: 32px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; color: var(--color-gray-500);
            transition: all var(--transition-fast);
        }
        .sheet-close:hover { background: var(--color-gray-200); color: var(--color-gray-700); }
        .sheet-body {
            padding: 0 16px 16px; overflow-y: auto; flex: 1;
            -webkit-overflow-scrolling: touch;
        }
        .sheet-region {
            font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--color-gray-500); margin-bottom: 6px;
        }
        .sheet-desc { font-size: 0.9rem; line-height: 1.6; color: var(--color-gray-700); margin-bottom: 10px; }
        .sheet-landmarks { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
        .sheet-landmarks span {
            display: inline-block;
            background: rgba(43,138,156,0.1);
            color: var(--color-teal-dark); font-size: 0.75rem; font-weight: 600;
            padding: 4px 10px; border-radius: var(--radius-full);
        }
        .sheet-scenario-text {
            font-size: 0.9rem; line-height: 1.6; color: var(--color-gray-700);
            margin-bottom: 10px; padding: 10px;
            background: var(--color-gray-50); border-radius: var(--radius-md);
            border-left: 3px solid var(--color-amber);
        }
        .sheet-subtitle { font-size: 0.82rem; font-weight: 700; color: var(--color-gray-700); margin-bottom: 8px; }
        .fracture-option {
            display: block; width: 100%; padding: 10px 14px; margin-bottom: 6px;
            border: 1.5px solid var(--color-gray-200); border-radius: var(--radius-lg);
            background: var(--color-white); font-size: 0.88rem;
            color: var(--color-gray-700); cursor: pointer; text-align: left;
            transition: all var(--transition-fast); font-family: var(--font-primary);
        }
        .fracture-option:hover { border-color: var(--color-teal); background: var(--color-gray-50); }
        .fracture-option:active { transform: scale(0.98); }
        .fracture-option.correct { border-color: var(--color-emerald); background: #ecfdf5; color: #065f46; }
        .fracture-option.incorrect { border-color: var(--color-red); background: #fef2f2; color: #991b1b; }

        .sheet-feedback { padding: 12px; border-radius: var(--radius-lg); margin-top: 10px; animation: slideUp 0.25s ease; }
        .sheet-feedback.success { background: #ecfdf5; border: 1px solid #a7f3d0; }
        .sheet-feedback.fail { background: #fef2f2; border: 1px solid #fecaca; }
        .sheet-feedback h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
        .sheet-feedback.success h4 { color: #065f46; }
        .sheet-feedback.fail h4 { color: #991b1b; }
        .sheet-feedback p { font-size: 0.85rem; line-height: 1.6; color: var(--color-gray-700); }
        .next-scenario-btn {
            width: 100%; margin-top: 10px; padding: 10px 16px;
            background: linear-gradient(135deg, var(--color-teal), var(--color-teal-dark));
            color: white; border: none; border-radius: var(--radius-lg);
            font-size: 0.88rem; font-weight: 600; cursor: pointer;
            transition: all var(--transition-fast); font-family: var(--font-primary);
        }
        .next-scenario-btn:hover { box-shadow: var(--shadow-md); }
        .next-scenario-btn:active { transform: scale(0.98); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body>
<div class="app-shell">
    <!-- ==================== NAVBAR ==================== -->
    <nav class="page-navbar">
        <span class="brand-text">
            <a href="landing.html">
                <span class="brand-para">para</span><span class="brand-mind">mind</span>
            </a>
        </span>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <!-- ==================== TOP BAR ==================== -->
    <div class="top-bar">
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="identify"><i class="bi bi-search"></i> Identify</button>
            <button class="mode-tab" data-mode="fracture"><i class="bi bi-bandaid"></i> Fracture Finder</button>
        </div>
        <div class="control-bar" id="identifyControls">
            <div class="view-toggle">
                <button class="view-toggle-btn active" data-view="anterior">Front</button>
                <button class="view-toggle-btn" data-view="posterior">Back</button>
            </div>
            <div class="sub-mode-toggle">
                <button class="sub-mode-btn active" data-submode="learn">Learn</button>
                <button class="sub-mode-btn" data-submode="quiz">Quiz</button>
            </div>
        </div>
        <div class="control-bar" id="fractureControls" style="display:none;">
            <div class="view-toggle">
                <button class="view-toggle-btn active" data-view="anterior">Front</button>
                <button class="view-toggle-btn" data-view="posterior">Back</button>
            </div>
            <div class="score-badge">Score: <strong id="fCorrect">0</strong>/<strong id="fTotal">0</strong></div>
        </div>
    </div>

    <!-- ==================== SKELETON VIEWPORT ==================== -->
    <div class="skeleton-viewport" id="skeletonViewport">
        <div class="view-label" id="viewLabel">Anterior View</div>

        <div class="quiz-prompt-float" id="quizPrompt">
            <span class="find-label">Find the:</span> <span id="quizBoneName">—</span>
        </div>
        <div class="quiz-score-float" id="quizScoreFloat">
            <span class="qs-correct"><i class="bi bi-check-circle-fill"></i> <span id="qCorrect">0</span></span>
            <span class="qs-wrong"><i class="bi bi-x-circle-fill"></i> <span id="qIncorrect">0</span></span>
            <span class="qs-streak"><i class="bi bi-lightning-fill"></i> <span id="qStreak">0</span></span>
        </div>
        <div class="quiz-flash" id="quizFlash"></div>

        <div class="scenario-bar" id="scenarioBar">
            <div class="scenario-bar-badge"><i class="bi bi-ambulance"></i> Patient Presentation</div>
            <div class="scenario-bar-text" id="scenarioBarText"></div>
            <div class="scenario-bar-instruction"><i class="bi bi-hand-index"></i> Tap the injured bone</div>
            <button class="scenario-bar-expand" id="scenarioExpand" title="Read full scenario"><i class="bi bi-chevron-down"></i></button>
        </div>

        <div class="skeleton-svg-wrap" id="skeletonWrap"></div>
    </div>
</div>

<!-- Sheet backdrop -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>

<!-- Bottom sheet -->
<div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
        <div class="sheet-title" id="sheetTitle"></div>
        <button class="sheet-close" id="sheetClose"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- ==================== SCRIPTS ==================== -->

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ==================== BONE DATA ====================
const BONES={skull:{name:"Skull",region:"Head",desc:"The bony structure of the head protecting the brain. Key for assessing head injuries — check for Battle's sign, raccoon eyes, and palpable depressions.",landmarks:["Frontal bone","Temporal bone","Occipital bone","Mastoid process"],views:["anterior","posterior"]},cervical_spine:{name:"Cervical Spine (C1–C7)",region:"Spine",desc:"Seven vertebrae of the neck. C-spine immobilisation is critical in trauma. C1 (atlas) and C2 (axis) injuries can be fatal.",landmarks:["C1 Atlas","C2 Axis (odontoid peg)","C7 vertebra prominens"],views:["anterior","posterior"]},thoracic_spine:{name:"Thoracic Spine (T1–T12)",region:"Spine",desc:"Twelve vertebrae that articulate with the ribs. Thoracic spine fractures often result from significant force (falls from height, RTCs).",landmarks:["Spinous processes","Rib articulations","T4 (Angle of Louis level)"],views:["anterior","posterior"]},lumbar_spine:{name:"Lumbar Spine (L1–L5)",region:"Spine",desc:"Five large vertebrae of the lower back. Burst fractures common in falls from height (axial loading). Cauda equina syndrome is a red flag.",landmarks:["L4–L5 (most common disc herniation)","Cauda equina below L1–L2"],views:["anterior","posterior"]},sacrum:{name:"Sacrum & Coccyx",region:"Spine / Pelvis",desc:"Fused vertebrae at the base of the spine forming the posterior pelvis. Sacral fractures often accompany pelvic ring injuries.",landmarks:["Sacroiliac joints","Coccyx"],views:["posterior"]},sternum:{name:"Sternum",region:"Thorax",desc:"The breastbone. Sternal fractures are associated with significant blunt chest trauma (seatbelt injuries) and may indicate underlying cardiac contusion.",landmarks:["Manubrium","Body of sternum","Xiphoid process","Angle of Louis (T2)"],views:["anterior"]},ribs:{name:"Ribs (1–12)",region:"Thorax",desc:"Twelve pairs forming the thoracic cage. Fractures of ribs 1–3 suggest major force. Lower rib fractures (9–12) may indicate splenic or hepatic injury. Flail chest = 3+ ribs fractured in 2+ places.",landmarks:["True ribs (1–7)","False ribs (8–10)","Floating ribs (11–12)"],views:["anterior","posterior"]},clavicle:{name:"Clavicle",region:"Upper Limb",desc:"The collarbone — one of the most commonly fractured bones. Usually from FOOSH or direct shoulder impact. Middle third fractures most common.",landmarks:["Sternoclavicular joint","Acromioclavicular joint","Mid-shaft"],views:["anterior"]},scapula:{name:"Scapula",region:"Upper Limb",desc:"The shoulder blade. Scapula fractures require significant force and often indicate other serious injuries (pulmonary contusion, rib fractures).",landmarks:["Acromion","Coracoid process","Glenoid fossa","Spine of scapula"],views:["posterior"]},humerus:{name:"Humerus",region:"Upper Limb",desc:"Upper arm bone. Proximal fractures common in elderly falls. Mid-shaft fractures risk radial nerve damage (wrist drop).",landmarks:["Head","Greater tuberosity","Surgical neck","Medial/lateral epicondyles"],views:["anterior","posterior"]},radius:{name:"Radius",region:"Upper Limb",desc:"Lateral forearm bone (thumb side). Distal radius fractures (Colles') are extremely common — classic 'dinner fork' deformity from FOOSH.",landmarks:["Radial head","Radial styloid","Distal radius"],views:["anterior","posterior"]},ulna:{name:"Ulna",region:"Upper Limb",desc:"Medial forearm bone (little finger side). Olecranon fractures from direct elbow impact. 'Nightstick fracture' — isolated ulna shaft from defensive injury.",landmarks:["Olecranon","Ulnar styloid","Coronoid process"],views:["anterior","posterior"]},hand:{name:"Hand & Wrist",region:"Upper Limb",desc:"8 carpals, 5 metacarpals, 14 phalanges. Scaphoid fractures are commonly missed — anatomical snuffbox tenderness is the key sign. Boxer's fracture = 5th metacarpal neck.",landmarks:["Scaphoid (snuffbox)","5th metacarpal","Anatomical snuffbox"],views:["anterior"]},pelvis:{name:"Pelvis",region:"Pelvis",desc:"A ring structure — if broken in one place, often broken in another. Pelvic fractures can cause life-threatening haemorrhage. Use pelvic binder. Never 'spring' the pelvis.",landmarks:["Iliac crest","ASIS","Pubic symphysis","Ischial tuberosity","Acetabulum"],views:["anterior"]},femur:{name:"Femur",region:"Lower Limb",desc:"Longest and strongest bone. #NOF extremely common in elderly — look for shortened, externally rotated leg. Shaft fractures can lose 1–1.5L blood.",landmarks:["Head","Neck","Greater trochanter","Lesser trochanter","Condyles"],views:["anterior","posterior"]},patella:{name:"Patella",region:"Lower Limb",desc:"The kneecap — a sesamoid bone. Fractures from direct impact (dashboard injury). Test: can the patient straight-leg raise?",landmarks:["Anterior surface","Patellar tendon"],views:["anterior"]},tibia:{name:"Tibia",region:"Lower Limb",desc:"The shinbone — main weight-bearing bone of the lower leg. Open fractures common due to minimal soft tissue anteriorly.",landmarks:["Tibial plateau","Tibial tuberosity","Medial malleolus","Anterior border"],views:["anterior","posterior"]},fibula:{name:"Fibula",region:"Lower Limb",desc:"Thin lateral bone of lower leg. Not weight-bearing but crucial for ankle stability. Lateral malleolus fractures are the most common ankle fracture.",landmarks:["Fibular head","Lateral malleolus"],views:["anterior","posterior"]},foot:{name:"Foot & Ankle",region:"Lower Limb",desc:"7 tarsals, 5 metatarsals, 14 phalanges. Calcaneal fractures from falls — always check lumbar spine too. Use Ottawa Ankle Rules.",landmarks:["Calcaneus","Talus","5th metatarsal base","Navicular"],views:["anterior"]}};

// ==================== FRACTURE SCENARIOS ====================
const FRACTURE_SCENARIOS=[{text:"82-year-old female, found on floor at nursing home. Left leg appears shortened and externally rotated. Unable to weight-bear. Pain in left hip/groin.",targetBone:"femur",fractureOptions:["Neck of femur","Femoral shaft fracture","Pubic ramus fracture","Hip dislocation"],correctOption:0,feedback:"Classic presentation of a fractured neck of femur (#NOF). The shortened, externally rotated leg is the hallmark sign. Provide analgesia, splint with traction if trained, transport to ED with orthopaedic capability."},{text:"45-year-old cyclist hit by car. Significant pain and swelling to right mid-thigh. Obvious deformity. Patient is pale and tachycardic (HR 120).",targetBone:"femur",fractureOptions:["Neck of femur","Femoral shaft fracture","Tibial fracture","Pelvic fracture"],correctOption:1,feedback:"Femoral shaft fracture with signs of haemorrhagic shock. A closed femur fracture can lose 1–1.5L of blood. Priorities: traction splint, IV access, fluid resuscitation, analgesia, rapid transport."},{text:"72-year-old female, tripped on a kerb and fell onto outstretched right hand. Pain and swelling to right wrist. Visible 'dinner fork' deformity.",targetBone:"radius",fractureOptions:["Colles' fracture (distal radius)","Scaphoid fracture","Smith's fracture","Ulna fracture"],correctOption:0,feedback:"Colles' fracture — a dorsally displaced distal radius fracture. The 'dinner fork' deformity is classic. Common mechanism: FOOSH in elderly patients. Immobilise, check distal neurovascular status."},{text:"28-year-old male rugby player. Fell onto point of right shoulder during a tackle. Visible step deformity at top of shoulder.",targetBone:"clavicle",fractureOptions:["Clavicle fracture","AC joint separation","Humeral head fracture","Scapula fracture"],correctOption:0,feedback:"Clavicle fracture — most common fracture from sports injuries. Usually mid-shaft (80%). Immobilise with a broad arm sling. Check for skin tenting."},{text:"55-year-old male, high-speed RTC, seatbelt sign across chest. Central chest pain worse on breathing. Tenderness over the breastbone.",targetBone:"sternum",fractureOptions:["Sternal fracture","Rib fractures","Thoracic spine fracture","Clavicle fracture"],correctOption:0,feedback:"Sternal fracture from seatbelt loading. Consider underlying cardiac contusion — obtain 12-lead ECG, monitor for arrhythmias. Also consider aortic injury."},{text:"60-year-old male, fell from a 3-metre ladder onto his feet. Severe pain in both heels, unable to stand.",targetBone:"foot",fractureOptions:["Calcaneal (heel) fractures","Ankle fracture","Talus fracture","Metatarsal fractures"],correctOption:0,feedback:"Bilateral calcaneal fractures — classic 'Don Juan fracture' from axial loading. Critical: always assess lumbar spine — 10% have associated spinal compression fractures."},{text:"34-year-old female, low-speed motorcycle accident. Right ankle swollen laterally. Pain over bony prominence on outside of ankle.",targetBone:"fibula",fractureOptions:["Lateral malleolus fracture","Medial malleolus fracture","Tibial plateau fracture","Calcaneal fracture"],correctOption:0,feedback:"Lateral malleolus fracture (distal fibula) — most common ankle fracture. Apply Ottawa Ankle Rules. Splint, elevate, check distal pulses."},{text:"78-year-old male on warfarin, fell in bathroom. Pain in left hip but can still weight-bear. No deformity or rotation.",targetBone:"pelvis",fractureOptions:["Pubic ramus fracture","Neck of femur fracture","Pelvic ring disruption","Hip dislocation"],correctOption:0,feedback:"Pubic ramus fracture — common in elderly. Unlike #NOF, patient can often weight-bear and there's no limb shortening. Monitor for occult bleeding."},{text:"22-year-old male punched a wall. Pain and swelling over outer side of right hand. 5th knuckle appears depressed.",targetBone:"hand",fractureOptions:["Boxer's fracture (5th metacarpal)","Scaphoid fracture","Bennett's fracture","Phalangeal fracture"],correctOption:0,feedback:"Boxer's fracture — 5th metacarpal neck fracture. Check for fight bite (wound over knuckle from teeth) which carries high infection risk."},{text:"40-year-old female, RTC passenger. Pain across right chest, worse on breathing. Tenderness over ribs 5–8. SpO₂ 94%.",targetBone:"ribs",fractureOptions:["Rib fractures (5–8)","Sternal fracture","Thoracic spine fracture","Pneumothorax only"],correctOption:0,feedback:"Multiple rib fractures. Key concerns: pneumothorax, haemothorax, underlying organ injury. If 3+ ribs in 2+ places = suspect flail chest. Analgesia is crucial."},{text:"19-year-old male footballer. Landed awkwardly — heard a 'crack'. Obvious angulation of right shin with bone visible through skin.",targetBone:"tibia",fractureOptions:["Open tibial shaft fracture","Fibula fracture","Tibial plateau fracture","Ankle dislocation"],correctOption:0,feedback:"Open (compound) tibial fracture — surgical emergency. Photograph wound, cover with saline-soaked sterile dressing, do NOT push bone back in. IV antibiotics per JRCALC."},{text:"65-year-old female, fell on ice landing on right hand. Pain in the anatomical snuffbox. Wrist X-ray may initially appear normal.",targetBone:"hand",fractureOptions:["Scaphoid fracture","Colles' fracture","Lunate dislocation","Metacarpal fracture"],correctOption:0,feedback:"Suspected scaphoid fracture — initial X-rays normal in up to 20% of cases. Anatomical snuffbox tenderness is the key sign. Missed fractures risk avascular necrosis."},{text:"50-year-old male, motorbike accident at 40mph. Pain in right shoulder, unable to lift arm. Bruising over upper arm.",targetBone:"humerus",fractureOptions:["Proximal humerus fracture","Shoulder dislocation","Clavicle fracture","Rotator cuff tear"],correctOption:0,feedback:"Proximal humerus fracture. Check axillary nerve function (sensation over 'regimental badge' area). Immobilise in sling against body."},{text:"70-year-old male, unwitnessed fall. Bruising over lower back. Midline lumbar spine tenderness. Legs feel 'tingling'.",targetBone:"lumbar_spine",fractureOptions:["Lumbar vertebral fracture","Sacral fracture","Pelvic fracture","Thoracic spine fracture"],correctOption:0,feedback:"Lumbar spine fracture with neurological compromise. Midline tenderness + neurological symptoms = spinal injury until proven otherwise. Full spinal immobilisation."},{text:"30-year-old male, head-on RTC at 50mph. GCS 13. Battle's sign behind right ear. Clear fluid from right ear.",targetBone:"skull",fractureOptions:["Base of skull fracture","Frontal bone fracture","Facial fractures","Cervical spine fracture"],correctOption:0,feedback:"Base of skull fracture. Battle's sign and CSF otorrhoea are classic. Do NOT pack ear/nose. Do NOT insert NPA. Maintain C-spine immobilisation."}];

// ==================== STATE ====================
const state = {
    mode: 'identify', subMode: 'learn', view: 'anterior',
    quizCorrect: 0, quizIncorrect: 0, quizStreak: 0,
    quizCurrentBone: null, quizBonePool: [],
    fractureIndex: 0, fractureCorrect: 0, fractureTotal: 0,
    fractureStep: 'selectBone', selectedBone: null,
    shuffledScenarios: [], sheetOpen: false
};

const dom = {
    skeletonWrap: document.getElementById('skeletonWrap'),
    viewLabel: document.getElementById('viewLabel'),
    quizPrompt: document.getElementById('quizPrompt'),
    quizBoneName: document.getElementById('quizBoneName'),
    quizScoreFloat: document.getElementById('quizScoreFloat'),
    qCorrect: document.getElementById('qCorrect'),
    qIncorrect: document.getElementById('qIncorrect'),
    qStreak: document.getElementById('qStreak'),
    quizFlash: document.getElementById('quizFlash'),
    scenarioBar: document.getElementById('scenarioBar'),
    scenarioBarText: document.getElementById('scenarioBarText'),
    scenarioExpand: document.getElementById('scenarioExpand'),
    identifyControls: document.getElementById('identifyControls'),
    fractureControls: document.getElementById('fractureControls'),
    fCorrect: document.getElementById('fCorrect'),
    fTotal: document.getElementById('fTotal'),
    sheetBackdrop: document.getElementById('sheetBackdrop'),
    bottomSheet: document.getElementById('bottomSheet'),
    sheetTitle: document.getElementById('sheetTitle'),
    sheetBody: document.getElementById('sheetBody'),
    sheetClose: document.getElementById('sheetClose')
};

// ==================== BOTTOM SHEET ====================
function openSheet(title, html) { dom.sheetTitle.textContent = title; dom.sheetBody.innerHTML = html; dom.sheetBackdrop.classList.add('visible'); dom.bottomSheet.classList.add('open'); state.sheetOpen = true; }
function closeSheet() { dom.sheetBackdrop.classList.remove('visible'); dom.bottomSheet.classList.remove('open'); state.sheetOpen = false; }
dom.sheetClose.addEventListener('click', closeSheet);
dom.sheetBackdrop.addEventListener('click', closeSheet);

// ==================== RENDER ====================
function renderSkeleton() { dom.skeletonWrap.innerHTML = state.view === 'anterior' ? buildAnteriorSVG() : buildPosteriorSVG(); dom.viewLabel.textContent = state.view === 'anterior' ? 'Anterior View' : 'Posterior View'; attachBoneListeners(); }
function attachBoneListeners() { document.querySelectorAll('.bone-group').forEach(el => { el.addEventListener('click', e => { e.stopPropagation(); const b = el.dataset.bone; if (b && !state.sheetOpen) handleBoneClick(b, el); }); el.addEventListener('touchstart', () => el.classList.add('hovered'), { passive: true }); el.addEventListener('touchend', () => setTimeout(() => el.classList.remove('hovered'), 300), { passive: true }); }); }
function handleBoneClick(id, el) { if (state.mode === 'identify') { state.subMode === 'learn' ? showBoneInfo(id) : handleQuizAnswer(id, el); } else if (state.mode === 'fracture' && state.fractureStep === 'selectBone') handleFractureSelectBone(id, el); }

// ==================== LEARN MODE ====================
function showBoneInfo(id) { const bone = BONES[id]; if (!bone) return; document.querySelectorAll('.bone-group.highlighted').forEach(b => b.classList.remove('highlighted')); document.querySelectorAll(`[data-bone="${id}"]`).forEach(b => b.classList.add('highlighted')); const landmarks = bone.landmarks.map(l => `<span>${l}</span>`).join(''); openSheet(bone.name, `<div class="sheet-region">${bone.region}</div><div class="sheet-desc">${bone.desc}</div><div class="sheet-subtitle">Key Landmarks</div><div class="sheet-landmarks">${landmarks}</div>`); }

// ==================== QUIZ MODE ====================
function startQuiz() { state.quizCorrect = 0; state.quizIncorrect = 0; state.quizStreak = 0; updateQuizScore(); rebuildQuizPool(); nextQuizQuestion(); }
function rebuildQuizPool() { state.quizBonePool = Object.keys(BONES).filter(id => BONES[id].views.includes(state.view)); shuffleArray(state.quizBonePool); }
function nextQuizQuestion() { if (state.quizBonePool.length === 0) rebuildQuizPool(); state.quizCurrentBone = state.quizBonePool.pop(); dom.quizBoneName.textContent = BONES[state.quizCurrentBone].name; document.querySelectorAll('.bone-group.correct,.bone-group.incorrect').forEach(b => b.classList.remove('correct', 'incorrect')); }
function handleQuizAnswer(id, el) { if (!state.quizCurrentBone) return; if (id === state.quizCurrentBone) { document.querySelectorAll(`[data-bone="${id}"]`).forEach(b => b.classList.add('correct')); state.quizCorrect++; state.quizStreak++; updateQuizScore(); showQuizFlash('✓', '#10b981'); setTimeout(() => nextQuizQuestion(), 700); } else { el.classList.add('incorrect'); state.quizIncorrect++; state.quizStreak = 0; updateQuizScore(); showQuizFlash('✗', '#ef4444'); setTimeout(() => document.querySelectorAll(`[data-bone="${state.quizCurrentBone}"]`).forEach(b => b.classList.add('correct')), 400); setTimeout(() => nextQuizQuestion(), 1200); } }
function showQuizFlash(icon, color) { const f = dom.quizFlash; f.textContent = icon; f.style.color = color; f.classList.remove('visible'); void f.offsetWidth; f.classList.add('visible'); setTimeout(() => f.classList.remove('visible'), 700); }
function updateQuizScore() { dom.qCorrect.textContent = state.quizCorrect; dom.qIncorrect.textContent = state.quizIncorrect; dom.qStreak.textContent = state.quizStreak; }

// ==================== FRACTURE FINDER ====================
function startFractureFinder() { state.fractureCorrect = 0; state.fractureTotal = 0; state.fractureIndex = 0; state.shuffledScenarios = [...FRACTURE_SCENARIOS]; shuffleArray(state.shuffledScenarios); updateFractureScore(); loadScenario(); }
function loadScenario() { if (state.fractureIndex >= state.shuffledScenarios.length) { state.fractureIndex = 0; shuffleArray(state.shuffledScenarios); } closeSheet(); const s = state.shuffledScenarios[state.fractureIndex]; dom.scenarioBarText.textContent = s.text; dom.scenarioBar.classList.add('visible'); state.fractureStep = 'selectBone'; state.selectedBone = null; document.querySelectorAll('.bone-group.correct,.bone-group.incorrect,.bone-group.highlighted').forEach(b => b.classList.remove('correct', 'incorrect', 'highlighted')); const t = BONES[s.targetBone]; if (t && !t.views.includes(state.view)) switchView(t.views[0]); }
function handleFractureSelectBone(id, el) { const s = state.shuffledScenarios[state.fractureIndex]; state.selectedBone = id; if (id === s.targetBone) { document.querySelectorAll(`[data-bone="${id}"]`).forEach(b => b.classList.add('correct')); state.fractureStep = 'selectType'; showFractureTypeSheet(s); } else { el.classList.add('incorrect'); document.querySelectorAll(`[data-bone="${s.targetBone}"]`).forEach(b => b.classList.add('highlighted')); state.fractureTotal++; updateFractureScore(); showFractureResultSheet(false, s, `The injured bone is the <strong>${BONES[s.targetBone].name}</strong>. ` + s.feedback); } }
function showFractureTypeSheet(s) { const opts = s.fractureOptions.map((o, i) => `<button class="fracture-option" data-fi="${i}">${o}</button>`).join(''); openSheet('What type of injury?', `<div class="sheet-scenario-text">${s.text}</div><div class="sheet-subtitle">Select the most likely injury:</div>${opts}`); dom.sheetBody.querySelectorAll('.fracture-option').forEach(btn => { btn.addEventListener('click', () => { const sel = parseInt(btn.dataset.fi); dom.sheetBody.querySelectorAll('.fracture-option').forEach(b => b.style.pointerEvents = 'none'); state.fractureTotal++; if (sel === s.correctOption) { btn.classList.add('correct'); state.fractureCorrect++; appendFeedbackToSheet(true, s.feedback); } else { btn.classList.add('incorrect'); dom.sheetBody.querySelectorAll('.fracture-option')[s.correctOption].classList.add('correct'); appendFeedbackToSheet(false, s.feedback); } updateFractureScore(); }); }); }
function appendFeedbackToSheet(ok, text) { const div = document.createElement('div'); div.className = `sheet-feedback ${ok ? 'success' : 'fail'}`; div.innerHTML = `<h4>${ok ? '<i class="bi bi-check-circle-fill"></i> Correct!' : '<i class="bi bi-x-circle-fill"></i> Not quite'}</h4><p>${text}</p><button class="next-scenario-btn" id="nextBtn">Next Scenario <i class="bi bi-arrow-right"></i></button>`; dom.sheetBody.appendChild(div); div.scrollIntoView({ behavior: 'smooth' }); document.getElementById('nextBtn').addEventListener('click', () => { state.fractureIndex++; loadScenario(); }); }
function showFractureResultSheet(ok, s, text) { openSheet(BONES[s.targetBone].name, `<div class="sheet-scenario-text">${s.text}</div><div class="sheet-feedback ${ok ? 'success' : 'fail'}"><h4>${ok ? '<i class="bi bi-check-circle-fill"></i> Correct!' : '<i class="bi bi-x-circle-fill"></i> Not quite'}</h4><p>${text}</p></div><button class="next-scenario-btn" id="nextBtn">Next Scenario <i class="bi bi-arrow-right"></i></button>`); document.getElementById('nextBtn').addEventListener('click', () => { state.fractureIndex++; loadScenario(); }); }
function updateFractureScore() { dom.fCorrect.textContent = state.fractureCorrect; dom.fTotal.textContent = state.fractureTotal; }
dom.scenarioExpand.addEventListener('click', () => { const s = state.shuffledScenarios[state.fractureIndex]; openSheet('Patient Presentation', `<div class="sheet-scenario-text">${s.text}</div><div class="scenario-bar-instruction" style="font-size:0.85rem;margin-top:10px"><i class="bi bi-hand-index"></i> Close this and tap the injured bone on the skeleton</div>`); });

// ==================== VIEW/MODE SWITCHING ====================
function switchView(v) { state.view = v; document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v)); renderSkeleton(); if (state.mode === 'identify' && state.subMode === 'quiz') { rebuildQuizPool(); nextQuizQuestion(); } }
function switchMode(m) { state.mode = m; closeSheet(); document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m)); dom.quizPrompt.classList.remove('visible'); dom.quizScoreFloat.classList.remove('visible'); dom.scenarioBar.classList.remove('visible'); document.querySelectorAll('.bone-group.correct,.bone-group.incorrect,.bone-group.highlighted').forEach(b => b.classList.remove('correct', 'incorrect', 'highlighted')); if (m === 'identify') { dom.identifyControls.style.display = 'flex'; dom.fractureControls.style.display = 'none'; if (state.subMode === 'quiz') { dom.quizPrompt.classList.add('visible'); dom.quizScoreFloat.classList.add('visible'); startQuiz(); } } else { dom.identifyControls.style.display = 'none'; dom.fractureControls.style.display = 'flex'; startFractureFinder(); } }
function switchSubMode(s) { state.subMode = s; closeSheet(); document.querySelectorAll('.sub-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.submode === s)); document.querySelectorAll('.bone-group.correct,.bone-group.incorrect,.bone-group.highlighted').forEach(b => b.classList.remove('correct', 'incorrect', 'highlighted')); if (s === 'quiz') { dom.quizPrompt.classList.add('visible'); dom.quizScoreFloat.classList.add('visible'); startQuiz(); } else { dom.quizPrompt.classList.remove('visible'); dom.quizScoreFloat.classList.remove('visible'); } }
function shuffleArray(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function setupEventListeners() { document.querySelectorAll('.mode-tab').forEach(t => t.addEventListener('click', () => switchMode(t.dataset.mode))); document.querySelectorAll('.view-toggle-btn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view))); document.querySelectorAll('.sub-mode-btn').forEach(b => b.addEventListener('click', () => switchSubMode(b.dataset.submode))); }

// ==================== INIT ====================
renderSkeleton();
setupEventListeners();
</script>
