<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | Paramind</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/menu-v2.css">
</head>
<body class="auth-page">
    <!-- Navigation -->
    <nav class="member-navbar">
        <div class="container">
            <span class="brand-text">
                <a class="navbar-brand" href="landing.html">
                    <span class="brand-para">para</span><span class="brand-mind">mind</span>
                </a>
            </span>
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Login Form -->
    <main class="auth-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5 col-xl-4">
                    <div class="auth-card">
                        <div class="auth-header">
                            <h1>Welcome back</h1>
                            <p>Sign in to continue your learning</p>
                        </div>
                        
                        <form id="loginForm" class="auth-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" placeholder="you@nhs.net" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="password-input-wrapper">
                                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                                    <button type="button" class="password-toggle" id="togglePassword">
                                        <i class="bi bi-eye" id="passwordIcon"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
                            </div>
                            
                            <!-- Error message placeholder -->
                            <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
                            
                            <!-- Success message placeholder -->
                            <div id="successMessage" class="alert alert-success d-none" role="alert"></div>
                            
                            <button type="submit" class="btn btn-primary w-100 btn-lg" id="submitBtn">
                                <span id="submitText">Sign In</span>
                                <span id="submitSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                            </button>
                        </form>
                        
                        <!-- Divider -->
                        <div style="display: flex; align-items: center; margin: 1.5rem 0; gap: 1rem;">
                            <div style="flex: 1; height: 1px; background: #dee2e6;"></div>
                            <span style="color: #6c757d; font-size: 0.85rem; font-weight: 500;">or</span>
                            <div style="flex: 1; height: 1px; background: #dee2e6;"></div>
                        </div>
                        
                        <!-- Google Sign-In -->
                        <button type="button" id="googleSignInBtn" style="display: flex; align-items: center; justify-content: center; gap: 0.75rem; width: 100%; padding: 0.75rem 1rem; border: 1px solid #dadce0; border-radius: 8px; background: #fff; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1rem; font-weight: 500; color: #3c4043; transition: background 0.2s, box-shadow 0.2s;">
                            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#34A853" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#FBBC05" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                            <span>Continue with Google</span>
                        </button>
                        
                        <div class="auth-footer">
                            <p>Don't have an account? <a href="register.html">Sign up free</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail, signInWithCredential, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { initializeFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { firebaseConfig } from './js/firebase-config.js';

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // Initialize Firestore with long polling (fixes Safari issues)
        const db = initializeFirestore(app, {
            experimentalForceLongPolling: true
        });

        // Check if user is already logged in
        let isGoogleSigningIn = false;
        onAuthStateChanged(auth, (user) => {
            if (user && !isGoogleSigningIn) {
                window.location.href = 'landing.html';
            }
        });

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.classList.remove('bi-eye');
                passwordIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordIcon.classList.remove('bi-eye-slash');
                passwordIcon.classList.add('bi-eye');
            }
        });

        // Helper functions
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            successEl.classList.add('d-none');
            errorEl.textContent = message;
            errorEl.classList.remove('d-none');
        }

        function showSuccess(message) {
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            errorEl.classList.add('d-none');
            successEl.textContent = message;
            successEl.classList.remove('d-none');
        }

        function setLoading(isLoading) {
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');
            
            submitBtn.disabled = isLoading;
            submitSpinner.classList.toggle('d-none', !isLoading);
            submitText.textContent = isLoading ? 'Signing in...' : 'Sign In';
        }

        function getErrorMessage(errorCode) {
            const errorMessages = {
                'auth/invalid-email': 'Please enter a valid email address.',
                'auth/user-disabled': 'This account has been disabled.',
                'auth/user-not-found': 'No account found with this email.',
                'auth/wrong-password': 'Incorrect password. Please try again.',
                'auth/invalid-credential': 'Invalid email or password. Please try again.',
                'auth/too-many-requests': 'Too many failed attempts. Please try again later.',
                'auth/network-request-failed': 'Network error. Please check your connection.'
            };
            return errorMessages[errorCode] || 'An error occurred. Please try again.';
        }

        // Forgot password handler
        document.getElementById('forgotPasswordLink').addEventListener('click', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showError('Please enter your email address first');
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess('Password reset email sent! Check your inbox.');
            } catch (error) {
                showError(getErrorMessage(error.code));
            }
        });

        // Form submission handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Clear previous messages
            document.getElementById('errorMessage').classList.add('d-none');
            document.getElementById('successMessage').classList.add('d-none');

            setLoading(true);

            try {
                // Sign in with Firebase Authentication
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                console.log('User signed in:', user.uid);

                // Try to get user data from Firestore and cache it
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        // Cache user data in localStorage
                        localStorage.setItem('paramind_user', JSON.stringify({
                            uid: user.uid,
                            firstName: userData.firstName || null,
                            surname: userData.surname || null,
                            email: userData.email,
                            trust: userData.trust,
                            trustFullName: userData.trustFullName,
                            subscriptionStatus: userData.subscriptionStatus,
                            dailyMessageCount: userData.dailyMessageCount || 0,
                            lastMessageDate: userData.lastMessageDate
                        }));
                        console.log('User data cached from Firestore');
                    }
                } catch (firestoreError) {
                    console.warn('Could not fetch Firestore data:', firestoreError);
                    // Continue anyway - landing.html will handle this
                }

                showSuccess('Signed in successfully! Redirecting...');
                
                // Redirect to chat
                setTimeout(() => {
                    window.location.href = 'landing.html';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                setLoading(false);
                showError(getErrorMessage(error.code));
            }
        });

        // ==================== GOOGLE SIGN-IN ====================
        document.getElementById('googleSignInBtn').addEventListener('click', async function() {
            const btn = this;
            btn.disabled = true;
            btn.style.opacity = '0.7';
            isGoogleSigningIn = true;

            try {
                let userCredential;

                // Check if running inside Capacitor native app
                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    // Use Capgo Social Login plugin
                    const SocialLogin = window.Capacitor.Plugins.SocialLogin;
                    await SocialLogin.initialize({
                        google: {
                            webClientId: '452173393964-d621ato4hq68nrvi1ngtqrln4j1fostm.apps.googleusercontent.com'
                        }
                    });
                    const response = await SocialLogin.login({
                        provider: 'google',
                        options: { scopes: ['profile', 'email'] }
                    });
                    const idToken = response.result.idToken;
                    const credential = GoogleAuthProvider.credential(idToken);
                    userCredential = await signInWithCredential(auth, credential);
                } else {
                    // Web fallback — use popup
                    const provider = new GoogleAuthProvider();
                    userCredential = await signInWithPopup(auth, provider);
                }

                const user = userCredential.user;
                console.log('Google sign-in success:', user.uid);

                // Check if user doc exists in Firestore
                const userDoc = await getDoc(doc(db, 'users', user.uid));

                if (userDoc.exists()) {
                    // Existing user — cache their data
                    const userData = userDoc.data();
                    localStorage.setItem('paramind_user', JSON.stringify({
                        uid: user.uid,
                        firstName: userData.firstName || user.displayName?.split(' ')[0] || null,
                        surname: userData.surname || user.displayName?.split(' ').slice(1).join(' ') || null,
                        email: userData.email || user.email,
                        trust: userData.trust,
                        trustFullName: userData.trustFullName,
                        subscriptionStatus: userData.subscriptionStatus,
                        dailyMessageCount: userData.dailyMessageCount || 0,
                        lastMessageDate: userData.lastMessageDate
                    }));
                    console.log('Existing user — cached Firestore data');
                } else {
                    // New Google user — send to register to pick their trust
                    const nameParts = (user.displayName || '').split(' ');
                    localStorage.setItem('paramind_google_pending', JSON.stringify({
                        uid: user.uid,
                        firstName: nameParts[0] || '',
                        surname: nameParts.slice(1).join(' ') || '',
                        email: user.email
                    }));
                    console.log('New Google user — redirecting to register');
                    window.location.href = 'register.html?google=1';
                    return;
                }

                showSuccess('Signed in successfully! Redirecting...');
                setTimeout(() => { window.location.href = 'landing.html'; }, 1000);

            } catch (error) {
                console.error('Google sign-in error:', error);
                btn.disabled = false;
                btn.style.opacity = '1';
                isGoogleSigningIn = false;

                if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
                    return; // User closed popup — not an error
                }
                showError('Google sign-in failed. Please try again or use email/password.');
            }
        });
    </script>
    <script src="js/app.js"></script>
    <script src="js/menu-v2.js"></script>
</body>
</html>
