<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | Paramind</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/menu-v2.css">
</head>
<body class="auth-page">
    <!-- Navigation -->
    <nav class="member-navbar">
        <div class="container">
            <span class="brand-text">
                <a class="navbar-brand" href="landing.html">
                    <span class="brand-para">para</span><span class="brand-mind">mind</span>
                </a>
            </span>
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Login Form -->
    <main class="auth-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5 col-xl-4">
                    <div class="auth-card">
                        <div class="auth-header">
                            <h1>Welcome back</h1>
                            <p>Sign in to continue your learning</p>
                            <div>
                            <p>Don't have an account? <a href="register.html">Sign up free</a></p>
                        </div>
                        </div>
                        
                        <form id="loginForm" class="auth-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" placeholder="you@nhs.net" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="password-input-wrapper">
                                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                                    <button type="button" class="password-toggle" id="togglePassword">
                                        <i class="bi bi-eye" id="passwordIcon"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
                            </div>
                            
                            <!-- Error message placeholder -->
                            <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
                            
                            <!-- Success message placeholder -->
                            <div id="successMessage" class="alert alert-success d-none" role="alert"></div>
                            
                            <button type="submit" class="btn btn-primary w-100 btn-lg" id="submitBtn">
                                <span id="submitText">Sign In</span>
                                <span id="submitSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                            </button>
                        </form>
                        
                        <!-- Divider -->
                        <div style="display: flex; align-items: center; margin: 1.5rem 0; gap: 1rem;">
                            <div style="flex: 1; height: 1px; background: #dee2e6;"></div>
                            <span style="color: #6c757d; font-size: 0.85rem; font-weight: 500;">or</span>
                            <div style="flex: 1; height: 1px; background: #dee2e6;"></div>
                        </div>
                        
                        <!-- Google Sign-In -->
                        <button type="button" id="googleSignInBtn" style="display: flex; align-items: center; justify-content: center; gap: 0.75rem; width: 100%; padding: 0.75rem 1rem; border: 1px solid #dadce0; border-radius: 8px; background: #fff; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1rem; font-weight: 500; color: #3c4043; transition: background 0.2s, box-shadow 0.2s;">
                            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#34A853" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#FBBC05" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                            <span>Continue with Google</span>
                        </button>
                        
                        <!-- Apple Sign-In (hidden by default, shown by JS on native platforms) -->
                        <button type="button" id="appleSignInBtn" style="display: none; align-items: center; justify-content: center; gap: 0.75rem; width: 100%; padding: 0.75rem 1rem; border: 1px solid #000; border-radius: 8px; background: #000; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1rem; font-weight: 500; color: #fff; transition: opacity 0.2s; margin-top: 0.75rem;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                            <span>Continue with Apple</span>
                        </button>
                        
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail, signInWithCredential, GoogleAuthProvider, OAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { initializeFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { firebaseConfig } from './js/firebase-config.js';

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // Initialize Firestore with long polling (fixes Safari issues)
        const db = initializeFirestore(app, {
            experimentalForceLongPolling: true
        });

        // Check if user is already logged in
        let isGoogleSigningIn = false;
        let isBiometricSigningIn = false;
        let isFormSigningIn = false;
        let isAppleSigningIn = false;
        onAuthStateChanged(auth, (user) => {
            if (user && !isGoogleSigningIn && !isBiometricSigningIn && !isFormSigningIn && !isAppleSigningIn) {
                window.location.href = 'landing.html';
            }
        });

        // ==================== BIOMETRIC AUTO-LOGIN ====================
        async function tryBiometricLogin() {
            // Only works on native platforms
            if (!window.Capacitor || !window.Capacitor.isNativePlatform()) return;
            
            const NativeBiometric = window.Capacitor.Plugins.NativeBiometric;
            if (!NativeBiometric) return;

            try {
                // Check if biometrics is available on this device
                const result = await NativeBiometric.isAvailable();
                if (!result.isAvailable) return;

                // Check if we have stored credentials
                let credentials;
                try {
                    credentials = await NativeBiometric.getCredentials({ server: 'paramind.co.uk' });
                } catch (e) {
                    // No stored credentials — skip biometric prompt
                    return;
                }

                if (!credentials || !credentials.username || !credentials.password) return;

                // Prompt for biometric verification
                await NativeBiometric.verifyIdentity({
                    reason: 'Sign in to Paramind',
                    title: 'Paramind Login',
                    subtitle: 'Use biometrics to sign in',
                    description: ''
                });

                // Biometric verified — sign in with stored credentials
                isBiometricSigningIn = true;
                console.log('Biometric verified — signing in...');

                const userCredential = await signInWithEmailAndPassword(auth, credentials.username, credentials.password);
                const user = userCredential.user;

                // Redirect immediately — landing.html will handle Firestore caching
                window.location.href = 'landing.html';

            } catch (error) {
                console.log('Biometric login skipped or failed:', error.message || error);
                isBiometricSigningIn = false;
                // User cancelled or biometric failed — just show normal login form
            }
        }

        // Try biometric login on page load
        tryBiometricLogin();

        // Show Apple Sign-In button only on native platforms
        if (window.Capacitor && window.Capacitor.isNativePlatform()) {
            const appleBtn = document.getElementById('appleSignInBtn');
            if (appleBtn) appleBtn.style.display = 'flex';
        }

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.classList.remove('bi-eye');
                passwordIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordIcon.classList.remove('bi-eye-slash');
                passwordIcon.classList.add('bi-eye');
            }
        });

        // Helper functions
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            successEl.classList.add('d-none');
            errorEl.textContent = message;
            errorEl.classList.remove('d-none');
        }

        function showSuccess(message) {
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            errorEl.classList.add('d-none');
            successEl.textContent = message;
            successEl.classList.remove('d-none');
        }

        function setLoading(isLoading) {
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');
            
            submitBtn.disabled = isLoading;
            submitSpinner.classList.toggle('d-none', !isLoading);
            submitText.textContent = isLoading ? 'Signing in...' : 'Sign In';
        }

        function getErrorMessage(errorCode) {
            const errorMessages = {
                'auth/invalid-email': 'Please enter a valid email address.',
                'auth/user-disabled': 'This account has been disabled.',
                'auth/user-not-found': 'No account found with this email.',
                'auth/wrong-password': 'Incorrect password. Please try again.',
                'auth/invalid-credential': 'Invalid email or password. Please try again.',
                'auth/too-many-requests': 'Too many failed attempts. Please try again later.',
                'auth/network-request-failed': 'Network error. Please check your connection.'
            };
            return errorMessages[errorCode] || 'An error occurred. Please try again.';
        }

        // Forgot password handler
        document.getElementById('forgotPasswordLink').addEventListener('click', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showError('Please enter your email address first');
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess('Password reset email sent! Check your inbox.');
            } catch (error) {
                showError(getErrorMessage(error.code));
            }
        });

        // Form submission handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Clear previous messages
            document.getElementById('errorMessage').classList.add('d-none');
            document.getElementById('successMessage').classList.add('d-none');

            isFormSigningIn = true;
            setLoading(true);

            try {
                // Sign in with Firebase Authentication
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                console.log('User signed in:', user.uid);

                // Try to get user data from Firestore and cache it
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        // Cache user data in localStorage
                        localStorage.setItem('paramind_user', JSON.stringify({
                            uid: user.uid,
                            firstName: userData.firstName || null,
                            surname: userData.surname || null,
                            email: userData.email,
                            trust: userData.trust,
                            trustFullName: userData.trustFullName,
                            subscriptionStatus: userData.subscriptionStatus,
                            dailyMessageCount: userData.dailyMessageCount || 0,
                            lastMessageDate: userData.lastMessageDate
                        }));
                        console.log('User data cached from Firestore');
                    }
                } catch (firestoreError) {
                    console.warn('Could not fetch Firestore data:', firestoreError);
                    // Continue anyway - landing.html will handle this
                }

                showSuccess('Signed in successfully! Redirecting...');
                
                // Store credentials for biometric login (native only)
                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    try {
                        const NativeBiometric = window.Capacitor.Plugins.NativeBiometric;
                        const bioResult = await NativeBiometric.isAvailable();
                        if (bioResult.isAvailable) {
                            await NativeBiometric.setCredentials({
                                username: email,
                                password: password,
                                server: 'paramind.co.uk'
                            });
                            console.log('Credentials stored for biometric login');
                        }
                    } catch (bioError) {
                        console.warn('Could not store biometric credentials:', bioError);
                    }
                }
                
                // Redirect to chat
                setTimeout(() => {
                    window.location.href = 'landing.html';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                isFormSigningIn = false;
                setLoading(false);
                showError(getErrorMessage(error.code));
            }
        });

        // ==================== GOOGLE SIGN-IN ====================
        document.getElementById('googleSignInBtn').addEventListener('click', async function() {
            const btn = this;
            btn.disabled = true;
            btn.style.opacity = '0.7';
            isGoogleSigningIn = true;

            try {
                let userCredential;

                // Check if running inside Capacitor native app
                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    // Use Capgo Social Login plugin
                    const SocialLogin = window.Capacitor.Plugins.SocialLogin;
                    await SocialLogin.initialize({
                        google: {
                            webClientId: '452173393964-d621ato4hq68nrvi1ngtqrln4j1fostm.apps.googleusercontent.com'
                        }
                    });
                    const response = await SocialLogin.login({
                        provider: 'google',
                        options: { scopes: ['profile', 'email'] }
                    });
                    const idToken = response.result.idToken;
                    const credential = GoogleAuthProvider.credential(idToken);
                    userCredential = await signInWithCredential(auth, credential);
                } else {
                    // Web fallback — use popup
                    const provider = new GoogleAuthProvider();
                    userCredential = await signInWithPopup(auth, provider);
                }

                const user = userCredential.user;
                console.log('Google sign-in success:', user.uid);

                // Check if user doc exists in Firestore
                const userDoc = await getDoc(doc(db, 'users', user.uid));

                if (userDoc.exists()) {
                    // Existing user — cache their data
                    const userData = userDoc.data();
                    localStorage.setItem('paramind_user', JSON.stringify({
                        uid: user.uid,
                        firstName: userData.firstName || user.displayName?.split(' ')[0] || null,
                        surname: userData.surname || user.displayName?.split(' ').slice(1).join(' ') || null,
                        email: userData.email || user.email,
                        trust: userData.trust,
                        trustFullName: userData.trustFullName,
                        subscriptionStatus: userData.subscriptionStatus,
                        dailyMessageCount: userData.dailyMessageCount || 0,
                        lastMessageDate: userData.lastMessageDate
                    }));
                    console.log('Existing user — cached Firestore data');
                } else {
                    // New Google user — send to register to pick their trust
                    const nameParts = (user.displayName || '').split(' ');
                    localStorage.setItem('paramind_google_pending', JSON.stringify({
                        uid: user.uid,
                        firstName: nameParts[0] || '',
                        surname: nameParts.slice(1).join(' ') || '',
                        email: user.email
                    }));
                    console.log('New Google user — redirecting to register');
                    window.location.href = 'register.html?google=1';
                    return;
                }

                showSuccess('Signed in successfully! Redirecting...');
                setTimeout(() => { window.location.href = 'landing.html'; }, 1000);

            } catch (error) {
                console.error('Google sign-in error:', error);
                btn.disabled = false;
                btn.style.opacity = '1';
                isGoogleSigningIn = false;

                if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
                    return; // User closed popup — not an error
                }
                showError('Google sign-in failed. Please try again or use email/password.');
            }
        });

        // ==================== APPLE SIGN-IN ====================
        document.getElementById('appleSignInBtn').addEventListener('click', async function() {
            const btn = this;
            btn.disabled = true;
            btn.style.opacity = '0.7';
            isAppleSigningIn = true;

            try {
                let userCredential;

                // Check if running inside Capacitor native app
                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    // Use Capgo Social Login plugin for native Apple Sign-In
                    const SocialLogin = window.Capacitor.Plugins.SocialLogin;
                    await SocialLogin.initialize({ apple: {} });

                    // Firebase requires a nonce for Apple Sign-In verification
                    // 1. Generate random raw nonce
                    // 2. SHA-256 hash it and send to Apple
                    // 3. Send raw nonce to Firebase so it can verify
                    function generateNonce(length) {
                        const charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
                        let result = '';
                        const values = new Uint8Array(length);
                        crypto.getRandomValues(values);
                        for (let i = 0; i < length; i++) {
                            result += charset[values[i] % charset.length];
                        }
                        return result;
                    }

                    async function sha256(plain) {
                        const encoder = new TextEncoder();
                        const data = encoder.encode(plain);
                        const hash = await crypto.subtle.digest('SHA-256', data);
                        const bytes = new Uint8Array(hash);
                        return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
                    }

                    const rawNonce = generateNonce(32);
                    const hashedNonce = await sha256(rawNonce);
                    console.log('Apple nonce generated. Raw length:', rawNonce.length, 'Hash:', hashedNonce);

                    const response = await SocialLogin.login({
                        provider: 'apple',
                        options: { scopes: ['email', 'name'], nonce: hashedNonce }
                    });

                    const result = response.result;
                    const idToken = result.idToken;
                    console.log('Apple idToken received, length:', idToken ? idToken.length : 'null');

                    // Create Firebase credential with the RAW nonce (Firebase hashes it to verify)
                    const appleProvider = new OAuthProvider('apple.com');
                    const credential = appleProvider.credential({
                        idToken: idToken,
                        rawNonce: rawNonce
                    });
                    console.log('Firebase credential created, attempting signIn...');
                    userCredential = await signInWithCredential(auth, credential);

                    // Apple only provides name on FIRST sign-in, so capture it now
                    if (result.givenName || result.familyName) {
                        localStorage.setItem('paramind_apple_name', JSON.stringify({
                            firstName: result.givenName || '',
                            surname: result.familyName || ''
                        }));
                    }
                } else {
                    // Web fallback — use Firebase popup
                    const appleProvider = new OAuthProvider('apple.com');
                    appleProvider.addScope('email');
                    appleProvider.addScope('name');
                    userCredential = await signInWithPopup(auth, appleProvider);
                }

                const user = userCredential.user;
                console.log('Apple sign-in success:', user.uid);

                // Check if user doc exists in Firestore
                const userDoc = await getDoc(doc(db, 'users', user.uid));

                if (userDoc.exists()) {
                    // Existing user — cache their data
                    const userData = userDoc.data();
                    localStorage.setItem('paramind_user', JSON.stringify({
                        uid: user.uid,
                        firstName: userData.firstName || user.displayName?.split(' ')[0] || null,
                        surname: userData.surname || user.displayName?.split(' ').slice(1).join(' ') || null,
                        email: userData.email || user.email,
                        trust: userData.trust,
                        trustFullName: userData.trustFullName,
                        subscriptionStatus: userData.subscriptionStatus,
                        dailyMessageCount: userData.dailyMessageCount || 0,
                        lastMessageDate: userData.lastMessageDate
                    }));
                    console.log('Existing Apple user — cached Firestore data');
                } else {
                    // New Apple user — send to register to pick their trust
                    // Try to get name from Apple (only available on first sign-in)
                    const appleName = JSON.parse(localStorage.getItem('paramind_apple_name') || '{}');
                    const nameParts = (user.displayName || '').split(' ');
                    localStorage.setItem('paramind_google_pending', JSON.stringify({
                        uid: user.uid,
                        firstName: appleName.firstName || nameParts[0] || '',
                        surname: appleName.surname || nameParts.slice(1).join(' ') || '',
                        email: user.email || ''
                    }));
                    console.log('New Apple user — redirecting to register');
                    window.location.href = 'register.html?google=1';
                    return;
                }

                showSuccess('Signed in successfully! Redirecting...');
                setTimeout(() => { window.location.href = 'landing.html'; }, 1000);

            } catch (error) {
                console.error('Apple sign-in error:', error);
                btn.disabled = false;
                btn.style.opacity = '1';
                isAppleSigningIn = false;

                if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
                    return; // User closed popup — not an error
                }
                showError('Apple sign-in failed. Please try again or use email/password.');
            }
        });
    </script>
    <script src="js/app.js"></script>
    <script src="js/menu-v2.js"></script>
</body>
</html>
